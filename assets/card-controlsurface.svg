<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320" role="img" aria-labelledby="title desc">
  <title id="title">ControlSurface &#8212; production engineering for AI agents</title>
  <desc id="desc">ControlSurface connects AgentRunGraph telemetry to failure intelligence, regression cases, and release gates. Version 0.1.0 release candidate 1.</desc>
  <defs>
    <pattern id="cs-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F8FAFC" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="cs-scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="cs-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono","Fira Code","SF Mono","Cascadia Code",monospace; }
    .cs-flow { stroke-dasharray: 8 6; animation: csFlow 2.2s linear infinite; }
    .cs-pulse { animation: csPulse 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .cs-blink { animation: csBlink 1.8s ease-in-out infinite; }
    .cs-scan { animation: csScan 6.5s linear infinite; }
    @keyframes csFlow { from { stroke-dashoffset: 28; } to { stroke-dashoffset: 0; } }
    @keyframes csPulse { 0%,100% { opacity:.35; transform:scale(.78); } 50% { opacity:1; transform:scale(1.1); } }
    @keyframes csBlink { 0%,100% { opacity:.3; } 50% { opacity:1; } }
    @keyframes csScan { from { transform:translateX(-220px); } to { transform:translateX(1140px); } }
    @media (prefers-reduced-motion: reduce) {
      .cs-flow,.cs-pulse,.cs-blink,.cs-scan { animation:none; }
    }
  </style>

  <rect width="920" height="320" fill="#080B10"/>
  <rect x="1" y="1" width="918" height="318" rx="6" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.58"/>
  <rect x="1" y="1" width="918" height="42" rx="6" fill="#080B10"/>
  <rect x="1" y="36" width="918" height="7" fill="#080B10"/>
  <rect x="1" y="43" width="918" height="224" fill="url(#cs-grid)"/>
  <rect class="cs-scan" x="-220" y="43" width="220" height="224" fill="url(#cs-scan)"/>
  <line x1="1" y1="43" x2="919" y2="43" stroke="#F8FAFC" stroke-opacity="0.1"/>

  <g class="mono">
    <text x="25" y="27" font-size="11" font-weight="700" letter-spacing="2.2" fill="#7A8A9E">FLAGSHIP // 01</text>
    <circle class="cs-blink" cx="759" cy="21" r="4" fill="#7DF9FF" filter="url(#cs-glow)"/>
    <text x="773" y="26" font-size="11" font-weight="700" letter-spacing="1.2" fill="#00E5FF">v0.1.0-rc.1</text>

    <text x="34" y="91" font-size="32" font-weight="900" letter-spacing="2.8" fill="#F8FAFC">CONTROLSURFACE</text>
    <text x="35" y="121" font-size="14.5" font-weight="700" fill="#00E5FF">Production engineering for AI agents</text>
    <text x="35" y="155" font-size="12.5" fill="#7A8A9E">Failures become evidence and reviewed</text>
    <text x="35" y="176" font-size="12.5" fill="#7A8A9E">regressions support repeatable releases.</text>

    <rect x="34" y="198" width="292" height="48" rx="4" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.36"/>
    <circle class="cs-blink" cx="53" cy="222" r="4" fill="#00E5FF"/>
    <text x="67" y="217" font-size="9.5" font-weight="700" fill="#F8FAFC" letter-spacing="1.2">RELEASE CANDIDATE</text>
    <text x="67" y="233" font-size="9" fill="#7A8A9E" letter-spacing="1">SELF-HOSTED &#183; APACHE-2.0</text>

    <text x="356" y="70" font-size="10" font-weight="700" letter-spacing="1.8" fill="#7A8A9E">PRODUCTION SIGNAL &#8594; RELEASE DECISION</text>
    <line x1="356" y1="79" x2="886" y2="79" stroke="#7A8A9E" opacity="0.22"/>

    <path class="cs-flow" d="M472 139H491M610 139H629M748 139H767" fill="none" stroke="#00E5FF" stroke-width="1.7" stroke-opacity="0.78"/>

    <g text-anchor="middle">
      <rect x="350" y="96" width="122" height="87" rx="5" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.58"/>
      <circle class="cs-pulse" cx="411" cy="116" r="5" fill="#7DF9FF" filter="url(#cs-glow)"/>
      <text x="411" y="143" font-size="11" font-weight="700" fill="#F8FAFC">AgentRunGraph</text>
      <text x="411" y="161" font-size="9.5" fill="#7A8A9E" letter-spacing="1">STRUCTURE</text>

      <rect x="488" y="96" width="122" height="87" rx="5" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.58"/>
      <circle class="cs-pulse" cx="549" cy="116" r="5" fill="#7DF9FF" filter="url(#cs-glow)" style="animation-delay:.55s"/>
      <text x="549" y="141" font-size="11" font-weight="700" fill="#F8FAFC">Failure</text>
      <text x="549" y="157" font-size="11" font-weight="700" fill="#F8FAFC">intelligence</text>
      <text x="549" y="174" font-size="9" fill="#7A8A9E" letter-spacing="1">DIAGNOSE</text>

      <rect x="626" y="96" width="122" height="87" rx="5" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.58"/>
      <circle class="cs-pulse" cx="687" cy="116" r="5" fill="#7DF9FF" filter="url(#cs-glow)" style="animation-delay:1.1s"/>
      <text x="687" y="141" font-size="11" font-weight="700" fill="#F8FAFC">Regression</text>
      <text x="687" y="157" font-size="11" font-weight="700" fill="#F8FAFC">cases</text>
      <text x="687" y="174" font-size="9" fill="#7A8A9E" letter-spacing="1">REVIEW</text>

      <rect x="764" y="96" width="122" height="87" rx="5" fill="#00E5FF" fill-opacity="0.07" stroke="#00E5FF" stroke-opacity="0.9"/>
      <circle class="cs-pulse" cx="825" cy="116" r="5" fill="#00E5FF" filter="url(#cs-glow)" style="animation-delay:1.65s"/>
      <text x="825" y="141" font-size="11" font-weight="700" fill="#F8FAFC">Release</text>
      <text x="825" y="157" font-size="11" font-weight="700" fill="#F8FAFC">gates</text>
      <text x="825" y="174" font-size="9" fill="#00E5FF" letter-spacing="1">SHIP</text>
    </g>

    <g font-size="9" font-weight="700" letter-spacing="1.1" text-anchor="middle">
      <rect x="350" y="201" width="122" height="34" rx="3" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.28"/>
      <text x="411" y="222" fill="#7A8A9E">TRACE CAPTURED</text>
      <rect x="488" y="201" width="122" height="34" rx="3" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.28"/>
      <text x="549" y="222" fill="#7A8A9E">FAILURE GROUPED</text>
      <rect x="626" y="201" width="122" height="34" rx="3" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.28"/>
      <text x="687" y="222" fill="#7A8A9E">CASE REVIEWED</text>
      <rect x="764" y="201" width="122" height="34" rx="3" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.42"/>
      <text x="825" y="222" fill="#00E5FF">DECISION RECORDED</text>
    </g>

    <rect x="1" y="267" width="918" height="52" fill="#080B10"/>
    <line x1="1" y1="267" x2="919" y2="267" stroke="#F8FAFC" stroke-opacity="0.1"/>
    <text x="28" y="299" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#00E5FF">STACK</text>
    <g font-size="11.5" font-weight="600" fill="#F8FAFC">
      <text x="109" y="299">Python</text><circle cx="166" cy="295" r="2" fill="#00E5FF"/>
      <text x="180" y="299">OpenTelemetry</text><circle cx="291" cy="295" r="2" fill="#00E5FF"/>
      <text x="305" y="299">PostgreSQL</text><circle cx="394" cy="295" r="2" fill="#00E5FF"/>
      <text x="408" y="299">ClickHouse</text><circle cx="490" cy="295" r="2" fill="#00E5FF"/>
      <text x="504" y="299">Next.js</text>
    </g>
    <text x="890" y="299" text-anchor="end" font-size="9.5" letter-spacing="1.2" fill="#7A8A9E">OBSERVE &#183; DIAGNOSE &#183; IMPROVE &#183; SHIP</text>
  </g>

  <g fill="none" stroke="#00E5FF" stroke-opacity="0.52" stroke-width="1.2">
    <path d="M9 27V9H27M893 9H911V27M9 293V311H27M893 311H911V293"/>
  </g>
</svg>

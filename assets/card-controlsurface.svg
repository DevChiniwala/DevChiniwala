<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-labelledby="title desc">
  <title id="title">ControlSurface &#8212; production engineering for AI agents</title>
  <desc id="desc">ControlSurface connects AgentRunGraph telemetry to failure intelligence, regression cases, and release gates. Version 0.1.0 release candidate 1.</desc>
  <defs>
    <pattern id="cs-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F8FAFC" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="cs-scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="cs-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono","Fira Code","SF Mono","Cascadia Code",monospace; }
    .cs-flow { stroke-dasharray: 8 6; animation: csFlow 2.2s linear infinite; }
    .cs-pulse { animation: csPulse 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .cs-blink { animation: csBlink 1.8s ease-in-out infinite; }
    .cs-scan { animation: csScan 6.5s linear infinite; }
    @keyframes csFlow { from { stroke-dashoffset: 28; } to { stroke-dashoffset: 0; } }
    @keyframes csPulse { 0%,100% { opacity:.35; transform:scale(.78); } 50% { opacity:1; transform:scale(1.1); } }
    @keyframes csBlink { 0%,100% { opacity:.3; } 50% { opacity:1; } }
    @keyframes csScan { from { transform:translateX(-220px); } to { transform:translateX(1140px); } }
    @media (prefers-reduced-motion: reduce) {
      .cs-flow,.cs-pulse,.cs-blink,.cs-scan { animation:none; }
    }
  </style>

  <rect width="920" height="420" fill="#080B10"/>
  <rect x="1" y="1" width="918" height="418" rx="6" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.58"/>
  <rect x="1" y="1" width="918" height="49" rx="6" fill="#080B10"/>
  <rect x="1" y="43" width="918" height="7" fill="#080B10"/>
  <rect x="1" y="50" width="918" height="306" fill="url(#cs-grid)"/>
  <rect class="cs-scan" x="-220" y="50" width="220" height="306" fill="url(#cs-scan)"/>
  <line x1="1" y1="50" x2="919" y2="50" stroke="#F8FAFC" stroke-opacity="0.1"/>

  <g class="mono">
    <text x="25" y="31" font-size="11" font-weight="700" letter-spacing="2.2" fill="#7A8A9E">FLAGSHIP // 01</text>
    <circle class="cs-blink" cx="759" cy="25" r="4" fill="#7DF9FF" filter="url(#cs-glow)"/>
    <text x="773" y="30" font-size="11" font-weight="700" letter-spacing="1.2" fill="#00E5FF">v0.1.0-rc.1</text>

    <text x="34" y="101" font-size="30" font-weight="900" letter-spacing="2.2" fill="#F8FAFC">CONTROLSURFACE</text>
    <text x="35" y="136" font-size="14.5" font-weight="700" fill="#00E5FF">Production engineering</text>
    <text x="35" y="157" font-size="14.5" font-weight="700" fill="#00E5FF">for AI agents</text>
    <text x="35" y="188" font-size="12.5" fill="#7A8A9E">Failures become evidence and reviewed</text>
    <text x="35" y="208" font-size="12.5" fill="#7A8A9E">regressions support repeatable releases.</text>

    <rect x="34" y="230" width="292" height="64" rx="5" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.42"/>
    <circle class="cs-blink" cx="56" cy="262" r="5" fill="#00E5FF"/>
    <text x="73" y="256" font-size="10.5" font-weight="700" fill="#F8FAFC" letter-spacing="1.2">RELEASE CANDIDATE</text>
    <text x="73" y="276" font-size="9.5" fill="#7A8A9E" letter-spacing="1">SELF-HOSTED &#183; APACHE-2.0</text>

    <rect x="34" y="308" width="292" height="28" rx="3" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.28"/>
    <text x="180" y="326" text-anchor="middle" font-size="9" font-weight="700" fill="#7A8A9E" letter-spacing="1">TRACE-TO-DECISION PIPELINE</text>

    <text x="350" y="80" font-size="10" font-weight="700" letter-spacing="1.8" fill="#7A8A9E">PRODUCTION SIGNAL &#8594; RELEASE DECISION</text>
    <line x1="350" y1="91" x2="886" y2="91" stroke="#7A8A9E" opacity="0.22"/>

    <path class="cs-flow" d="M472 180H486M608 180H622M744 180H758" fill="none" stroke="#00E5FF" stroke-width="1.8" stroke-opacity="0.82"/>

    <g text-anchor="middle">
      <rect x="350" y="108" width="122" height="144" rx="6" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.58"/>
      <circle cx="411" cy="139" r="14" fill="#00E5FF" fill-opacity="0.06" stroke="#00E5FF" stroke-opacity="0.44"/>
      <circle class="cs-pulse" cx="411" cy="139" r="6" fill="#7DF9FF" filter="url(#cs-glow)"/>
      <text x="411" y="179" font-size="11.5" font-weight="700" fill="#F8FAFC">AgentRunGraph</text>
      <text x="411" y="200" font-size="9.5" fill="#7A8A9E" letter-spacing="1">STRUCTURE</text>
      <line x1="368" y1="216" x2="454" y2="216" stroke="#7A8A9E" stroke-opacity="0.2"/>
      <text x="411" y="235" font-size="8.5" fill="#7A8A9E" letter-spacing=".7">TRACE CAPTURE</text>

      <rect x="486" y="108" width="122" height="144" rx="6" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.58"/>
      <circle cx="547" cy="139" r="14" fill="#00E5FF" fill-opacity="0.06" stroke="#00E5FF" stroke-opacity="0.44"/>
      <circle class="cs-pulse" cx="547" cy="139" r="6" fill="#7DF9FF" filter="url(#cs-glow)" style="animation-delay:.55s"/>
      <text x="547" y="175" font-size="11.5" font-weight="700" fill="#F8FAFC">Failure</text>
      <text x="547" y="192" font-size="11.5" font-weight="700" fill="#F8FAFC">intelligence</text>
      <text x="547" y="210" font-size="9.5" fill="#7A8A9E" letter-spacing="1">DIAGNOSE</text>
      <line x1="504" y1="220" x2="590" y2="220" stroke="#7A8A9E" stroke-opacity="0.2"/>
      <text x="547" y="238" font-size="8.5" fill="#7A8A9E" letter-spacing=".7">FAILURE GROUP</text>

      <rect x="622" y="108" width="122" height="144" rx="6" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.58"/>
      <circle cx="683" cy="139" r="14" fill="#00E5FF" fill-opacity="0.06" stroke="#00E5FF" stroke-opacity="0.44"/>
      <circle class="cs-pulse" cx="683" cy="139" r="6" fill="#7DF9FF" filter="url(#cs-glow)" style="animation-delay:1.1s"/>
      <text x="683" y="175" font-size="11.5" font-weight="700" fill="#F8FAFC">Regression</text>
      <text x="683" y="192" font-size="11.5" font-weight="700" fill="#F8FAFC">cases</text>
      <text x="683" y="210" font-size="9.5" fill="#7A8A9E" letter-spacing="1">REVIEW</text>
      <line x1="640" y1="220" x2="726" y2="220" stroke="#7A8A9E" stroke-opacity="0.2"/>
      <text x="683" y="238" font-size="8.5" fill="#7A8A9E" letter-spacing=".7">CASE REVIEW</text>

      <rect x="758" y="108" width="128" height="144" rx="6" fill="#00E5FF" fill-opacity="0.07" stroke="#00E5FF" stroke-opacity="0.9"/>
      <circle cx="822" cy="139" r="14" fill="#00E5FF" fill-opacity="0.08" stroke="#00E5FF" stroke-opacity="0.62"/>
      <circle class="cs-pulse" cx="822" cy="139" r="6" fill="#00E5FF" filter="url(#cs-glow)" style="animation-delay:1.65s"/>
      <text x="822" y="175" font-size="11.5" font-weight="700" fill="#F8FAFC">Release</text>
      <text x="822" y="192" font-size="11.5" font-weight="700" fill="#F8FAFC">gates</text>
      <text x="822" y="210" font-size="9.5" fill="#00E5FF" letter-spacing="1">SHIP</text>
      <line x1="777" y1="220" x2="867" y2="220" stroke="#00E5FF" stroke-opacity="0.26"/>
      <text x="822" y="238" font-size="8.5" fill="#00E5FF" letter-spacing=".7">DECISION LOG</text>
    </g>

    <g font-size="9" font-weight="700" letter-spacing="1.05" text-anchor="middle">
      <rect x="350" y="268" width="122" height="42" rx="3" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.28"/>
      <text x="411" y="293" fill="#7A8A9E">TRACE CAPTURED</text>
      <rect x="486" y="268" width="122" height="42" rx="3" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.28"/>
      <text x="547" y="293" fill="#7A8A9E">FAILURE GROUPED</text>
      <rect x="622" y="268" width="122" height="42" rx="3" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.28"/>
      <text x="683" y="293" fill="#7A8A9E">CASE REVIEWED</text>
      <rect x="758" y="268" width="128" height="42" rx="3" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.42"/>
      <text x="822" y="293" fill="#00E5FF">DECISION RECORDED</text>
    </g>

    <rect x="350" y="320" width="536" height="24" rx="3" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.34"/>
    <text x="365" y="336" font-size="8.5" font-weight="700" fill="#00E5FF" letter-spacing="1">REPOSITORY PROOF</text>
    <text x="500" y="336" font-size="8.5" font-weight="700" fill="#7A8A9E" letter-spacing=".8">ARCHITECTURE.MD &#183; TAG v0.1.0-rc.1 &#183; APACHE-2.0</text>

    <rect x="1" y="356" width="918" height="63" fill="#080B10"/>
    <line x1="1" y1="356" x2="919" y2="356" stroke="#F8FAFC" stroke-opacity="0.1"/>
    <text x="28" y="394" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#00E5FF">STACK</text>
    <g font-size="11" font-weight="600" fill="#F8FAFC">
      <text x="109" y="394">Python</text><circle cx="164" cy="390" r="2" fill="#00E5FF"/>
      <text x="178" y="394">OpenTelemetry</text><circle cx="286" cy="390" r="2" fill="#00E5FF"/>
      <text x="300" y="394">PostgreSQL</text><circle cx="386" cy="390" r="2" fill="#00E5FF"/>
      <text x="400" y="394">ClickHouse</text><circle cx="480" cy="390" r="2" fill="#00E5FF"/>
      <text x="494" y="394">Next.js</text><circle cx="555" cy="390" r="2" fill="#00E5FF"/>
      <text x="569" y="394">Docker Compose</text>
    </g>
    <text x="890" y="394" text-anchor="end" font-size="9" letter-spacing="1" fill="#7A8A9E">OBSERVE &#183; DIAGNOSE &#183; IMPROVE &#183; SHIP</text>
  </g>

  <g fill="none" stroke="#00E5FF" stroke-opacity="0.52" stroke-width="1.2">
    <path d="M9 27V9H27M893 9H911V27M9 393V411H27M893 411H911V393"/>
  </g>
</svg>

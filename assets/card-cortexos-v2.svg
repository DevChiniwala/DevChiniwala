<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-labelledby="title desc">
  <title id="title">CortexOS &#8212; evidence-backed company research</title>
  <desc id="desc">CortexOS combines multi-agent research workflows with deterministic Rust source verification in a Tauri and React application backed by SQLite.</desc>
  <defs>
    <pattern id="cx-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20H40M20 0V40" fill="none" stroke="#F8FAFC" stroke-opacity="0.03"/>
    </pattern>
    <linearGradient id="cx-scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="cx-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono","Fira Code","SF Mono","Cascadia Code",monospace; }
    .cx-flow { stroke-dasharray: 8 6; animation: cxFlow 2.5s linear infinite; }
    .cx-pulse { animation: cxPulse 2.7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .cx-check { animation: cxCheck 3.4s ease-in-out infinite; }
    .cx-scan { animation: cxScan 7s linear infinite; }
    @keyframes cxFlow { from { stroke-dashoffset: 28; } to { stroke-dashoffset: 0; } }
    @keyframes cxPulse { 0%,100% { opacity:.35; transform:scale(.78); } 50% { opacity:1; transform:scale(1.08); } }
    @keyframes cxCheck { 0%,25%,100% { opacity:.3; } 45%,78% { opacity:1; } }
    @keyframes cxScan { from { transform:translateX(-220px); } to { transform:translateX(1140px); } }
    @media (prefers-reduced-motion: reduce) {
      .cx-flow,.cx-pulse,.cx-check,.cx-scan { animation:none; }
    }
  </style>

  <rect width="920" height="420" fill="#080B10"/>
  <rect x="1" y="1" width="918" height="418" rx="6" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.58"/>
  <rect x="1" y="1" width="918" height="42" rx="6" fill="#080B10"/>
  <rect x="1" y="36" width="918" height="7" fill="#080B10"/>
  <rect x="1" y="43" width="918" height="313" fill="url(#cx-grid)"/>
  <rect class="cx-scan" x="-220" y="43" width="220" height="313" fill="url(#cx-scan)"/>
  <line x1="1" y1="43" x2="919" y2="43" stroke="#F8FAFC" stroke-opacity="0.1"/>

  <g class="mono">
    <text x="25" y="27" font-size="11" font-weight="700" letter-spacing="2.2" fill="#7A8A9E">FLAGSHIP // 03</text>
    <circle class="cx-check" cx="725" cy="21" r="4" fill="#7DF9FF" filter="url(#cx-glow)"/>
    <text x="739" y="26" font-size="11" font-weight="700" letter-spacing="1.2" fill="#00E5FF">DETERMINISTIC VERIFY</text>

    <text x="34" y="91" font-size="34" font-weight="900" letter-spacing="3.5" fill="#F8FAFC">CORTEXOS</text>
    <text x="35" y="121" font-size="14.5" font-weight="700" fill="#00E5FF">Evidence-backed company research</text>
    <text x="35" y="155" font-size="12.5" fill="#7A8A9E">Multi-agent research with deterministic</text>
    <text x="35" y="176" font-size="12.5" fill="#7A8A9E">verification against source evidence.</text>

    <rect x="34" y="198" width="292" height="48" rx="4" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.36"/>
    <circle class="cx-check" cx="53" cy="222" r="4" fill="#00E5FF"/>
    <text x="67" y="217" font-size="9.5" font-weight="700" fill="#F8FAFC" letter-spacing="1.1">LOCAL APPLICATION</text>
    <text x="67" y="233" font-size="9" fill="#7A8A9E" letter-spacing="1">SOURCE EVIDENCE &#183; APACHE-2.0</text>

    <rect x="34" y="260" width="292" height="36" rx="4" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.34"/>
    <text x="180" y="282" text-anchor="middle" font-size="9" font-weight="700" fill="#7A8A9E" letter-spacing=".9">DETERMINISTIC VERIFICATION PATH</text>
    <rect x="34" y="308" width="292" height="28" rx="3" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.28"/>
    <text x="180" y="326" text-anchor="middle" font-size="9" font-weight="700" fill="#7A8A9E" letter-spacing="1">LOCAL &#183; INSPECTABLE &#183; SOURCE-BACKED</text>

    <text x="356" y="69" font-size="10" font-weight="700" letter-spacing="1.8" fill="#7A8A9E">RESEARCH &#8594; VERIFIED OUTPUT</text>
    <line x1="356" y1="79" x2="886" y2="79" stroke="#7A8A9E" opacity="0.22"/>

    <g text-anchor="middle">
      <text x="382" y="95" font-size="8.5" font-weight="700" fill="#7A8A9E" letter-spacing="1">SOURCES</text>
      <rect x="354" y="106" width="56" height="26" rx="3" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.42"/>
      <rect x="354" y="145" width="56" height="26" rx="3" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.42"/>
      <rect x="354" y="184" width="56" height="26" rx="3" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.42"/>
      <circle class="cx-pulse" cx="382" cy="119" r="3.5" fill="#7DF9FF"/>
      <circle class="cx-pulse" cx="382" cy="158" r="3.5" fill="#7DF9FF" style="animation-delay:.55s"/>
      <circle class="cx-pulse" cx="382" cy="197" r="3.5" fill="#7DF9FF" style="animation-delay:1.1s"/>

      <path class="cx-flow" d="M410 119H438V158H452M410 158H452M410 197H438V158" fill="none" stroke="#00E5FF" stroke-width="1.4" stroke-opacity="0.7"/>

      <rect x="452" y="112" width="124" height="92" rx="5" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.62"/>
      <circle class="cx-pulse" cx="514" cy="132" r="5" fill="#7DF9FF" filter="url(#cx-glow)" style="animation-delay:.8s"/>
      <text x="514" y="158" font-size="11" font-weight="700" fill="#F8FAFC">Multi-agent</text>
      <text x="514" y="175" font-size="11" font-weight="700" fill="#F8FAFC">workflow</text>
      <text x="514" y="193" font-size="8.5" fill="#7A8A9E" letter-spacing="1">RESEARCH</text>

      <path class="cx-flow" d="M576 158H606" fill="none" stroke="#00E5FF" stroke-width="1.6" stroke-opacity="0.74"/>

      <path d="M620 112H716L732 158L716 204H620L604 158Z" fill="#00E5FF" fill-opacity="0.07" stroke="#00E5FF" stroke-opacity="0.86"/>
      <circle class="cx-pulse" cx="668" cy="132" r="5" fill="#00E5FF" filter="url(#cx-glow)" style="animation-delay:1.4s"/>
      <text x="668" y="157" font-size="11" font-weight="700" fill="#00E5FF">RUST</text>
      <text x="668" y="174" font-size="10.5" font-weight="700" fill="#F8FAFC">SOURCE VERIFY</text>
      <text x="668" y="191" font-size="8.5" fill="#7A8A9E" letter-spacing="1">DETERMINISTIC</text>

      <path class="cx-flow" d="M732 158H758" fill="none" stroke="#00E5FF" stroke-width="1.6" stroke-opacity="0.74"/>

      <rect x="758" y="112" width="128" height="92" rx="5" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.62"/>
      <path class="cx-check" d="M807 133L817 143L838 122" fill="none" stroke="#7DF9FF" stroke-width="2.2"/>
      <text x="822" y="165" font-size="10.5" font-weight="700" fill="#F8FAFC">EVIDENCE-BACKED</text>
      <text x="822" y="182" font-size="10.5" font-weight="700" fill="#F8FAFC">RESEARCH</text>
      <text x="822" y="197" font-size="8.5" fill="#7A8A9E" letter-spacing="1">OUTPUT</text>
    </g>

    <text x="356" y="232" font-size="9.5" font-weight="700" fill="#7A8A9E" letter-spacing="1.4">LOCAL RESEARCH SYSTEM</text>
    <path class="cx-flow" d="M480 270H499M617 270H636M754 270H773" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.72"/>
    <g text-anchor="middle">
      <rect x="356" y="245" width="124" height="51" rx="5" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.5"/>
      <text x="418" y="266" font-size="9.5" font-weight="700" fill="#F8FAFC">TAURI + REACT</text>
      <text x="418" y="282" font-size="8" fill="#7A8A9E" letter-spacing=".8">LOCAL APP</text>
      <rect x="499" y="245" width="118" height="51" rx="5" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.5"/>
      <text x="558" y="266" font-size="9.5" font-weight="700" fill="#F8FAFC">SQLITE</text>
      <text x="558" y="282" font-size="8" fill="#7A8A9E" letter-spacing=".8">LOCAL STATE</text>
      <rect x="636" y="245" width="118" height="51" rx="5" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.5"/>
      <text x="695" y="266" font-size="9.5" font-weight="700" fill="#F8FAFC">RUST + TOKIO</text>
      <text x="695" y="282" font-size="8" fill="#7A8A9E" letter-spacing=".8">VERIFY CORE</text>
      <rect x="773" y="245" width="113" height="51" rx="5" fill="#00E5FF" fill-opacity="0.06" stroke="#00E5FF" stroke-opacity="0.72"/>
      <path class="cx-check" d="M797 266L803 272L815 259" fill="none" stroke="#7DF9FF" stroke-width="1.8"/>
      <text x="840" y="267" font-size="9" font-weight="700" fill="#00E5FF">SOURCE</text>
      <text x="840" y="282" font-size="9" font-weight="700" fill="#00E5FF">EVIDENCE</text>
    </g>

    <rect x="356" y="320" width="530" height="24" rx="3" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.34"/>
    <text x="371" y="336" font-size="8.5" font-weight="700" fill="#00E5FF" letter-spacing="1">REPOSITORY PROOF</text>
    <text x="506" y="336" font-size="8.5" font-weight="700" fill="#7A8A9E" letter-spacing=".72">PACKAGE.JSON &#183; SRC-TAURI/CARGO.TOML &#183; APACHE-2.0</text>

    <rect x="1" y="356" width="918" height="63" fill="#080B10"/>
    <line x1="1" y1="356" x2="919" y2="356" stroke="#F8FAFC" stroke-opacity="0.1"/>
    <text x="28" y="394" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#00E5FF">STACK</text>
    <g font-size="11.5" font-weight="600" fill="#F8FAFC">
      <text x="109" y="394">Tauri</text><circle cx="152" cy="390" r="2" fill="#00E5FF"/>
      <text x="166" y="394">React</text><circle cx="211" cy="390" r="2" fill="#00E5FF"/>
      <text x="225" y="394">TypeScript</text><circle cx="308" cy="390" r="2" fill="#00E5FF"/>
      <text x="322" y="394">Rust</text><circle cx="359" cy="390" r="2" fill="#00E5FF"/>
      <text x="373" y="394">Tokio</text><circle cx="414" cy="390" r="2" fill="#00E5FF"/>
      <text x="428" y="394">SQLite</text>
    </g>
    <text x="890" y="394" text-anchor="end" font-size="9.5" letter-spacing="1.2" fill="#7A8A9E">RESEARCH &#183; VERIFY &#183; TRACE TO SOURCE</text>
  </g>

  <g fill="none" stroke="#00E5FF" stroke-opacity="0.52" stroke-width="1.2">
    <path d="M9 27V9H27M893 9H911V27M9 393V411H27M893 411H911V393"/>
  </g>
</svg>

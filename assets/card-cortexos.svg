<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes flowDash { to { stroke-dashoffset: 0; } }
  </style>

  <!-- Background -->
  <rect width="920" height="420" fill="#080B10"/>
  <rect x="1" y="1" width="918" height="418" fill="#10141D" stroke="#00E5FF" stroke-width="1"/>

  <!-- Header strip -->
  <rect x="1" y="1" width="918" height="40" fill="#080B10"/>
  <line x1="1" y1="41" x2="919" y2="41" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="24" y="27" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="11" fill="#7A8A9E" letter-spacing="2">FLAGSHIP // 03</text>

  <circle cx="840" cy="21" r="4" fill="#00E5FF">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="852" y="25" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#00E5FF" letter-spacing="1" font-weight="700">ACTIVE</text>

  <!-- Project name -->
  <text x="40" y="88" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="36" font-weight="900" fill="#F8FAFC" letter-spacing="4">CORTEXOS</text>
  <text x="40" y="112" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="13" fill="#7A8A9E" letter-spacing="1">AI-Native Intelligence Operating System</text>

  <!-- Capabilities -->
  <text x="40" y="150" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#00E5FF" letter-spacing="2" font-weight="700">CAPABILITIES</text>

  <g font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">
    <rect x="40" y="160" width="146" height="22" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="50" y="175">Autonomous Agents</text>

    <rect x="196" y="160" width="144" height="22" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="206" y="175">Market Research</text>

    <rect x="350" y="160" width="140" height="22" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="360" y="175">Signal Analysis</text>

    <rect x="500" y="160" width="130" height="22" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="510" y="175">Insight Verify</text>

    <rect x="640" y="160" width="160" height="22" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="650" y="175">Business Intel Gen</text>

    <rect x="40" y="190" width="150" height="22" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="50" y="205">Multi-Agent Workflows</text>

    <rect x="200" y="190" width="154" height="22" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="210" y="205">Verification-First</text>
  </g>

  <!-- Architecture -->
  <text x="40" y="245" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#00E5FF" letter-spacing="2" font-weight="700">ARCHITECTURE</text>

  <g font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="11" fill="#F8FAFC">
    <rect x="60" y="260" width="100" height="32" rx="2" fill="#080B10" stroke="#00E5FF" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="78" y="280">Ingest</text>

    <path d="M 165,276 L 205,276" stroke="#00E5FF" stroke-width="1" fill="none" stroke-dasharray="6 3" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="18" to="0" dur="2s" repeatCount="indefinite"/>
    </path>

    <rect x="210" y="260" width="110" height="32" rx="2" fill="#080B10" stroke="#00E5FF" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <text x="228" y="280">Research</text>

    <path d="M 325,276 L 365,276" stroke="#00E5FF" stroke-width="1" fill="none" stroke-dasharray="6 3" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="18" to="0" dur="2s" repeatCount="indefinite"/>
    </path>

    <rect x="370" y="260" width="100" height="32" rx="2" fill="#080B10" stroke="#00E5FF" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="390" y="280">Analyze</text>

    <path d="M 475,276 L 515,276" stroke="#00E5FF" stroke-width="1" fill="none" stroke-dasharray="6 3" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="18" to="0" dur="2s" repeatCount="indefinite"/>
    </path>

    <rect x="520" y="260" width="90" height="32" rx="2" fill="#080B10" stroke="#00E5FF" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="540" y="280">Verify</text>

    <path d="M 615,276 L 655,276" stroke="#00E5FF" stroke-width="1" fill="none" stroke-dasharray="6 3" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="18" to="0" dur="2s" repeatCount="indefinite"/>
    </path>

    <rect x="660" y="260" width="110" height="32" rx="2" fill="#080B10" stroke="#00E5FF" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="680" y="280">Generate</text>

    <path d="M 775,276 L 815,276" stroke="#00E5FF" stroke-width="1" fill="none" stroke-dasharray="6 3" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="18" to="0" dur="2s" repeatCount="indefinite"/>
    </path>

    <rect x="820" y="260" width="70" height="32" rx="2" fill="#080B10" stroke="#00E5FF" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="835" y="280">Ship</text>
  </g>

  <g font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#7A8A9E">
    <text x="80" y="313">Data</text>
    <text x="232" y="313">Agents</text>
    <text x="392" y="313">Signals</text>
    <text x="538" y="313">Truth</text>
    <text x="682" y="313">Report</text>
    <text x="835" y="313">Deploy</text>
  </g>

  <!-- Bottom divider -->
  <line x1="40" y1="340" x2="880" y2="340" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Tech stack -->
  <text x="40" y="365" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#00E5FF" letter-spacing="2" font-weight="700">STACK</text>
  <g font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="11" fill="#7A8A9E">
    <text x="40" y="390">TypeScript</text>
    <circle cx="112" cy="386" r="2" fill="#00E5FF" opacity="0.5"/>
    <text x="122" y="390">LangGraph</text>
    <circle cx="196" cy="386" r="2" fill="#00E5FF" opacity="0.5"/>
    <text x="206" y="390">OpenAI</text>
    <circle cx="256" cy="386" r="2" fill="#00E5FF" opacity="0.5"/>
    <text x="266" y="390">Temporal</text>
    <circle cx="326" cy="386" r="2" fill="#00E5FF" opacity="0.5"/>
    <text x="336" y="390">Node.js</text>
    <circle cx="392" cy="386" r="2" fill="#00E5FF" opacity="0.5"/>
    <text x="402" y="390">Redis</text>
    <circle cx="440" cy="386" r="2" fill="#00E5FF" opacity="0.5"/>
    <text x="450" y="390">Docker</text>
  </g>

  <!-- Corner accents -->
  <g stroke="#00E5FF" stroke-width="1" opacity="0.3" fill="none">
    <path d="M 8,8 L 8,24"/><path d="M 8,8 L 24,8"/>
    <path d="M 912,8 L 912,24"/><path d="M 912,8 L 896,8"/>
    <path d="M 8,412 L 8,396"/><path d="M 8,412 L 24,412"/>
    <path d="M 912,412 L 912,396"/><path d="M 912,412 L 896,412"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="920" height="200" role="img" aria-labelledby="title desc">
  <title id="title">HeyClara — Personal AI Assistant Daemon</title>
  <desc id="desc">A public personal AI assistant daemon with scheduled jobs, two-stage memory, MCP tools, multi-channel messaging, and failover.</desc>

  <style>
    .mono { font-family: "JetBrains Mono", "Fira Code", "SFMono-Regular", Consolas, monospace; }
  </style>

  <rect width="920" height="200" fill="#080B10"/>
  <rect x="1" y="1" width="918" height="198" fill="#10141D" stroke="#00E5FF" stroke-width="1"/>

  <rect x="1" y="1" width="918" height="36" fill="#080B10"/>
  <line x1="1" y1="37" x2="919" y2="37" stroke="#F8FAFC" stroke-opacity="0.06"/>

  <text x="24" y="24" class="mono" font-size="10.5" fill="#7A8A9E" letter-spacing="2">APPLIED SYSTEM // 05</text>
  <circle cx="731" cy="19" r="4" fill="#00E5FF"/>
  <text x="896" y="23" class="mono" font-size="10" font-weight="700" fill="#00E5FF" letter-spacing="1" text-anchor="end">PUBLIC PERSONAL PROJECT</text>

  <text x="40" y="78" class="mono" font-size="31" font-weight="900" fill="#F8FAFC" letter-spacing="4">HEYCLARA</text>
  <text x="40" y="101" class="mono" font-size="13.5" fill="#7A8A9E" letter-spacing="0.5">Personal AI assistant daemon for durable, multi-channel work.</text>

  <text x="40" y="127" class="mono" font-size="10" font-weight="700" fill="#00E5FF" letter-spacing="2">CAPABILITIES</text>
  <text x="40" y="148" class="mono" font-size="12.5" fill="#F8FAFC">SCHEDULED JOBS  ·  TWO-STAGE MEMORY  ·  MCP TOOLS  ·  FAILOVER</text>
  <text x="40" y="166" class="mono" font-size="12" fill="#7A8A9E">TELEGRAM  ·  SLACK  ·  VOICE  ·  SMS</text>

  <line x1="40" y1="176" x2="880" y2="176" stroke="#F8FAFC" stroke-opacity="0.06"/>
  <text x="40" y="193" class="mono" font-size="10" font-weight="700" fill="#00E5FF" letter-spacing="2">STACK</text>
  <text x="102" y="193" class="mono" font-size="11" fill="#7A8A9E">BUN  ·  TYPESCRIPT  ·  CLAUDE AGENT SDK  ·  POSTGRESQL</text>

  <g stroke="#00E5FF" stroke-width="1" stroke-opacity="0.30" fill="none">
    <path d="M 8,8 L 8,22 M 8,8 L 22,8"/>
    <path d="M 912,8 L 912,22 M 912,8 L 898,8"/>
    <path d="M 8,192 L 8,178 M 8,192 L 22,192"/>
    <path d="M 912,192 L 912,178 M 912,192 L 898,192"/>
  </g>
</svg>

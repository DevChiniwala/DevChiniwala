<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320" role="img" aria-labelledby="title desc">
  <title id="title">MNEMOS &#8212; self-editing bi-temporal memory for AI agents</title>
  <desc id="desc">MNEMOS combines self-editing bi-temporal memory, six-signal retrieval, a knowledge graph, FSRS, and sleep consolidation.</desc>
  <defs>
    <pattern id="mn-grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#F8FAFC" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="mn-scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="mn-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono","Fira Code","SF Mono","Cascadia Code",monospace; }
    .mn-flow { stroke-dasharray: 9 7; animation: mnFlow 3s linear infinite; }
    .mn-pulse { animation: mnPulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .mn-state { animation: mnState 4.8s ease-in-out infinite; }
    .mn-scan { animation: mnScan 7s linear infinite; }
    @keyframes mnFlow { from { stroke-dashoffset: 32; } to { stroke-dashoffset: 0; } }
    @keyframes mnPulse { 0%,100% { opacity:.35; transform:scale(.78); } 50% { opacity:1; transform:scale(1.08); } }
    @keyframes mnState { 0%,100% { opacity:.36; } 35%,65% { opacity:1; } }
    @keyframes mnScan { from { transform:translateX(-220px); } to { transform:translateX(1140px); } }
    @media (prefers-reduced-motion: reduce) {
      .mn-flow,.mn-pulse,.mn-state,.mn-scan { animation:none; }
    }
  </style>

  <rect width="920" height="320" fill="#080B10"/>
  <rect x="1" y="1" width="918" height="318" rx="6" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.58"/>
  <rect x="1" y="1" width="918" height="42" rx="6" fill="#080B10"/>
  <rect x="1" y="36" width="918" height="7" fill="#080B10"/>
  <rect x="1" y="43" width="918" height="224" fill="url(#mn-grid)"/>
  <rect class="mn-scan" x="-220" y="43" width="220" height="224" fill="url(#mn-scan)"/>
  <line x1="1" y1="43" x2="919" y2="43" stroke="#F8FAFC" stroke-opacity="0.1"/>

  <g class="mono">
    <text x="25" y="27" font-size="11" font-weight="700" letter-spacing="2.2" fill="#F8FAFC" opacity="0.58">FLAGSHIP</text>
    <text x="112" y="27" font-size="11" font-weight="700" letter-spacing="2.2" fill="#7A8A9E">// 02</text>
    <circle class="mn-state" cx="766" cy="21" r="4" fill="#7DF9FF" filter="url(#mn-glow)"/>
    <text x="780" y="26" font-size="11" font-weight="700" letter-spacing="1.2" fill="#00E5FF">BETA // RESEARCH</text>

    <text x="34" y="91" font-size="35" font-weight="900" letter-spacing="4" fill="#F8FAFC">MNEMOS</text>
    <text x="35" y="121" font-size="14.5" font-weight="700" fill="#00E5FF">Self-editing bi-temporal memory</text>
    <text x="35" y="155" font-size="12.5" fill="#7A8A9E">Revises memory while preserving when</text>
    <text x="35" y="176" font-size="12.5" fill="#7A8A9E">knowledge was observed and when it was valid.</text>

    <rect x="34" y="198" width="292" height="48" rx="4" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.36"/>
    <circle class="mn-pulse" cx="53" cy="222" r="4" fill="#00E5FF"/>
    <text x="67" y="217" font-size="9.5" font-weight="700" fill="#F8FAFC" letter-spacing="1.1">6-SIGNAL RETRIEVAL</text>
    <text x="67" y="233" font-size="9" fill="#7A8A9E" letter-spacing=".8">GRAPH &#183; TEMPORAL &#183; CONSOLIDATION</text>

    <text x="356" y="69" font-size="10" font-weight="700" letter-spacing="1.8" fill="#7A8A9E">MEMORY LIFECYCLE</text>
    <line x1="356" y1="79" x2="886" y2="79" stroke="#7A8A9E" opacity="0.22"/>

    <g text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1">
      <rect x="356" y="92" width="121" height="34" rx="4" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.48"/>
      <text x="416.5" y="113" fill="#F8FAFC">ADD</text>
      <rect x="486" y="92" width="121" height="34" rx="4" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.48"/>
      <text x="546.5" y="113" fill="#F8FAFC">UPDATE</text>
      <rect x="616" y="92" width="121" height="34" rx="4" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.48"/>
      <text x="676.5" y="113" fill="#F8FAFC">DELETE</text>
      <rect x="746" y="92" width="140" height="34" rx="4" fill="#00E5FF" fill-opacity="0.06" stroke="#00E5FF" stroke-opacity="0.72"/>
      <text x="816" y="113" fill="#00E5FF">NOOP</text>
    </g>

    <text x="356" y="154" font-size="9.5" font-weight="700" fill="#7A8A9E" letter-spacing="1.2">OBSERVED TIME</text>
    <text x="356" y="210" font-size="9.5" font-weight="700" fill="#7A8A9E" letter-spacing="1.2">VALID TIME</text>
    <path class="mn-flow" d="M468 150H882M468 206H882" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.62"/>
    <path d="M872 145L883 150L872 155M872 201L883 206L872 211" fill="none" stroke="#00E5FF" stroke-opacity="0.7"/>

    <g text-anchor="middle">
      <circle cx="512" cy="150" r="8" fill="#080B10" stroke="#00E5FF" stroke-width="1.4"/>
      <circle class="mn-pulse" cx="512" cy="150" r="3.5" fill="#7DF9FF" filter="url(#mn-glow)"/>
      <text x="512" y="174" font-size="8.5" fill="#7A8A9E">WRITE</text>
      <circle cx="660" cy="150" r="8" fill="#080B10" stroke="#00E5FF" stroke-width="1.4"/>
      <circle class="mn-pulse" cx="660" cy="150" r="3.5" fill="#7DF9FF" filter="url(#mn-glow)" style="animation-delay:.8s"/>
      <text x="660" y="174" font-size="8.5" fill="#7A8A9E">REVISE</text>
      <circle cx="820" cy="150" r="8" fill="#080B10" stroke="#00E5FF" stroke-width="1.4"/>
      <circle class="mn-pulse" cx="820" cy="150" r="3.5" fill="#7DF9FF" filter="url(#mn-glow)" style="animation-delay:1.6s"/>
      <text x="820" y="174" font-size="8.5" fill="#7A8A9E">RECALL</text>

      <circle cx="554" cy="206" r="8" fill="#080B10" stroke="#00E5FF" stroke-width="1.4"/>
      <circle class="mn-pulse" cx="554" cy="206" r="3.5" fill="#7DF9FF" style="animation-delay:.4s"/>
      <text x="554" y="231" font-size="8.5" fill="#7A8A9E">START</text>
      <circle cx="714" cy="206" r="8" fill="#080B10" stroke="#00E5FF" stroke-width="1.4"/>
      <circle class="mn-pulse" cx="714" cy="206" r="3.5" fill="#7DF9FF" style="animation-delay:1.2s"/>
      <text x="714" y="231" font-size="8.5" fill="#7A8A9E">CHANGE</text>
      <circle cx="850" cy="206" r="8" fill="#080B10" stroke="#00E5FF" stroke-width="1.4"/>
      <circle class="mn-pulse" cx="850" cy="206" r="3.5" fill="#7DF9FF" style="animation-delay:2s"/>
      <text x="850" y="231" font-size="8.5" fill="#7A8A9E">EXPIRE</text>
    </g>

    <rect x="1" y="267" width="918" height="52" fill="#080B10"/>
    <line x1="1" y1="267" x2="919" y2="267" stroke="#F8FAFC" stroke-opacity="0.1"/>
    <text x="28" y="299" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#00E5FF">STACK</text>
    <g font-size="11.5" font-weight="600" fill="#F8FAFC">
      <text x="109" y="299">Python</text><circle cx="166" cy="295" r="2" fill="#00E5FF"/>
      <text x="180" y="299">MCP</text><circle cx="211" cy="295" r="2" fill="#00E5FF"/>
      <text x="225" y="299">Neo4j</text><circle cx="273" cy="295" r="2" fill="#00E5FF"/>
      <text x="287" y="299">FAISS</text>
    </g>
    <g font-size="9.5" font-weight="700" text-anchor="middle">
      <rect x="393" y="281" width="139" height="26" rx="3" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.3"/>
      <text x="462.5" y="298" fill="#7A8A9E">KNOWLEDGE GRAPH</text>
      <rect x="542" y="281" width="92" height="26" rx="3" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.3"/>
      <text x="588" y="298" fill="#7A8A9E">FSRS</text>
      <rect x="644" y="281" width="242" height="26" rx="3" fill="#10141D" stroke="#00E5FF" stroke-opacity="0.3"/>
      <text x="765" y="298" fill="#7A8A9E">SLEEP CONSOLIDATION</text>
    </g>
  </g>

  <g fill="none" stroke="#00E5FF" stroke-opacity="0.52" stroke-width="1.2">
    <path d="M9 27V9H27M893 9H911V27M9 293V311H27M893 311H911V293"/>
  </g>
</svg>

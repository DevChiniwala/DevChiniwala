<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes flowDash { to { stroke-dashoffset: 0; } }
  </style>

  <!-- Background -->
  <rect width="920" height="420" fill="#080B10"/>
  <rect x="1" y="1" width="918" height="418" fill="#10141D" stroke="#00E5FF" stroke-width="1"/>

  <!-- Header strip -->
  <rect x="1" y="1" width="918" height="40" fill="#080B10"/>
  <line x1="1" y1="41" x2="919" y2="41" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="24" y="27" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="11" fill="#7A8A9E" letter-spacing="2">FLAGSHIP // 03</text>

  <circle cx="840" cy="21" r="4" fill="#00E5FF">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="852" y="25" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#00E5FF" letter-spacing="1" font-weight="700">ACTIVE</text>

  <!-- Project name -->
  <text x="40" y="88" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="36" font-weight="900" fill="#F8FAFC" letter-spacing="4">PAGEPILOT</text>
  <text x="40" y="112" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="13" fill="#7A8A9E" letter-spacing="1">AI Browser Workspace — RAG-Powered Web Intelligence</text>

  <!-- Capabilities -->
  <text x="40" y="150" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#00E5FF" letter-spacing="2" font-weight="700">CAPABILITIES</text>

  <g font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">
    <rect x="40" y="160" width="74" height="22" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="50" y="175">Memory</text>

    <rect x="124" y="160" width="100" height="22" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="134" y="175">Embeddings</text>

    <rect x="234" y="160" width="130" height="22" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="244" y="175">Semantic Search</text>

    <rect x="374" y="160" width="130" height="22" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="384" y="175">Hybrid Retrieval</text>

    <rect x="514" y="160" width="120" height="22" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="524" y="175">Agent Runtime</text>

    <rect x="644" y="160" width="140" height="22" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="654" y="175">Chrome Extension</text>
  </g>

  <!-- Architecture -->
  <text x="40" y="220" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#00E5FF" letter-spacing="2" font-weight="700">ARCHITECTURE</text>

  <g font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="11" fill="#F8FAFC">
    <!-- Browser -->
    <rect x="60" y="240" width="90" height="32" rx="2" fill="#080B10" stroke="#00E5FF" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="78" y="260">Browser</text>

    <path d="M 155,256 L 195,256" stroke="#00E5FF" stroke-width="1" fill="none" stroke-dasharray="6 3" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="18" to="0" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Extension -->
    <rect x="200" y="240" width="100" height="32" rx="2" fill="#080B10" stroke="#00E5FF" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <text x="216" y="260">Extension</text>

    <path d="M 305,256 L 345,256" stroke="#00E5FF" stroke-width="1" fill="none" stroke-dasharray="6 3" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="18" to="0" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- FastAPI -->
    <rect x="350" y="240" width="90" height="32" rx="2" fill="#080B10" stroke="#00E5FF" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="370" y="260">FastAPI</text>

    <path d="M 445,256 L 485,256" stroke="#00E5FF" stroke-width="1" fill="none" stroke-dasharray="6 3" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="18" to="0" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- LangChain -->
    <rect x="490" y="240" width="110" height="32" rx="2" fill="#080B10" stroke="#00E5FF" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="508" y="260">LangChain</text>

    <path d="M 605,256 L 645,256" stroke="#00E5FF" stroke-width="1" fill="none" stroke-dasharray="6 3" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="18" to="0" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- ChromaDB -->
    <rect x="650" y="240" width="100" height="32" rx="2" fill="#080B10" stroke="#00E5FF" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="668" y="260">ChromaDB</text>

    <path d="M 755,256 L 795,256" stroke="#00E5FF" stroke-width="1" fill="none" stroke-dasharray="6 3" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="18" to="0" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Gemini -->
    <rect x="800" y="240" width="80" height="32" rx="2" fill="#080B10" stroke="#00E5FF" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="820" y="260">Gemini</text>
  </g>

  <g font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#7A8A9E">
    <text x="78" y="295">Input</text>
    <text x="220" y="295">Capture</text>
    <text x="370" y="295">Process</text>
    <text x="512" y="295">Orchestrate</text>
    <text x="670" y="295">Store</text>
    <text x="818" y="295">Generate</text>
  </g>

  <!-- Bottom divider -->
  <line x1="40" y1="330" x2="880" y2="330" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Tech stack -->
  <text x="40" y="358" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#00E5FF" letter-spacing="2" font-weight="700">STACK</text>
  <g font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="11" fill="#7A8A9E">
    <text x="40" y="383">TypeScript</text>
    <circle cx="112" cy="379" r="2" fill="#00E5FF" opacity="0.5"/>
    <text x="122" y="383">React</text>
    <circle cx="162" cy="379" r="2" fill="#00E5FF" opacity="0.5"/>
    <text x="172" y="383">Python</text>
    <circle cx="220" cy="379" r="2" fill="#00E5FF" opacity="0.5"/>
    <text x="230" y="383">FastAPI</text>
    <circle cx="286" cy="379" r="2" fill="#00E5FF" opacity="0.5"/>
    <text x="296" y="383">LangChain</text>
    <circle cx="368" cy="379" r="2" fill="#00E5FF" opacity="0.5"/>
    <text x="378" y="383">ChromaDB</text>
    <circle cx="442" cy="379" r="2" fill="#00E5FF" opacity="0.5"/>
    <text x="452" y="383">Gemini</text>
    <circle cx="500" cy="379" r="2" fill="#00E5FF" opacity="0.5"/>
    <text x="510" y="383">PostgreSQL</text>
  </g>

  <!-- Corner accents -->
  <g stroke="#00E5FF" stroke-width="1" opacity="0.3" fill="none">
    <path d="M 8,8 L 8,24"/><path d="M 8,8 L 24,8"/>
    <path d="M 912,8 L 912,24"/><path d="M 912,8 L 896,8"/>
    <path d="M 8,412 L 8,396"/><path d="M 8,412 L 24,412"/>
    <path d="M 912,412 L 912,396"/><path d="M 912,412 L 896,412"/>
  </g>
</svg>
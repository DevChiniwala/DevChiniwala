<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-labelledby="title desc">
  <title id="title">VYGOT — adaptive learning intelligence</title>
  <desc id="desc">A private team project with a public launch upcoming, presented at a deliberately high level as an adaptive learning system.</desc>
  <defs>
    <pattern id="vy-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7A8A9E" stroke-width=".5" opacity=".09"/>
    </pattern>
    <linearGradient id="vy-scan-gradient" x1="0" x2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00E5FF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="vy-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="vy-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#00E5FF"/>
    </marker>
  </defs>
  <style>
    .mono { font-family:'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',monospace; }
    .flow { animation:vy-flow 3s linear infinite; }
    .pulse { transform-box:fill-box; transform-origin:center; animation:vy-pulse 2.8s ease-in-out infinite; }
    .scan { animation:vy-scan 8s ease-in-out infinite; }
    .blink { animation:vy-blink 2.4s ease-in-out infinite; }
    @keyframes vy-flow { to { stroke-dashoffset:-36; } }
    @keyframes vy-pulse { 0%,100% { opacity:.38; transform:scale(.82); } 50% { opacity:1; transform:scale(1.12); } }
    @keyframes vy-scan { 0%,15% { transform:translateX(-220px); } 78%,100% { transform:translateX(1140px); } }
    @keyframes vy-blink { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    @media (prefers-reduced-motion:reduce) { .flow,.pulse,.scan,.blink { animation:none; } }
  </style>

  <rect width="920" height="300" fill="#080B10"/>
  <rect x="1" y="1" width="918" height="298" rx="5" fill="#10141D" stroke="#00E5FF"/>
  <rect x="1" y="37" width="918" height="215" fill="url(#vy-grid)"/>
  <rect x="1" y="1" width="918" height="36" rx="5" fill="#080B10"/>
  <rect x="1" y="32" width="918" height="5" fill="#080B10"/>
  <rect class="scan" x="-220" y="37" width="220" height="215" fill="url(#vy-scan-gradient)"/>

  <g class="mono">
    <text x="25" y="25" font-size="11" font-weight="700" fill="#7A8A9E" letter-spacing="2.2">APPLIED SYSTEM // 04</text>
    <circle class="blink" cx="640" cy="20" r="4" fill="#7DF9FF" filter="url(#vy-glow)"/>
    <text x="653" y="24" font-size="10" font-weight="700" fill="#00E5FF" letter-spacing="1">PRIVATE TEAM PROJECT</text>
    <text x="895" y="24" text-anchor="end" font-size="9" fill="#7A8A9E" letter-spacing=".8">LAUNCH UPCOMING</text>

    <text x="35" y="92" font-size="36" font-weight="900" fill="#F8FAFC" letter-spacing="4">VYGOT</text>
    <text x="36" y="124" font-size="15" font-weight="700" fill="#00E5FF">Adaptive learning intelligence</text>
    <text x="36" y="158" font-size="12.5" fill="#7A8A9E">Personalizes instructional strategy around</text>
    <text x="36" y="179" font-size="12.5" fill="#7A8A9E">how an individual learner learns.</text>

    <g transform="translate(35 199)">
      <rect width="300" height="38" rx="4" fill="#080B10" stroke="#7A8A9E" opacity=".95"/>
      <rect width="4" height="38" rx="2" fill="#00E5FF"/>
      <text x="18" y="16" font-size="8.5" font-weight="700" fill="#7DF9FF" letter-spacing="1.2">DISCLOSURE</text>
      <text x="18" y="30" font-size="9.5" fill="#F8FAFC">Product details remain private before launch.</text>
    </g>

    <text x="386" y="66" font-size="10" font-weight="700" fill="#7A8A9E" letter-spacing="1.8">ADAPTIVE LEARNING LOOP // HIGH-LEVEL VIEW</text>

    <path class="flow" d="M445 150H555M655 150H770" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#vy-arrow)" opacity=".75"/>
    <path class="flow" d="M814 188C814 229 455 229 455 188" fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="5 7" marker-end="url(#vy-arrow)" opacity=".45" style="animation-delay:.5s"/>

    <g transform="translate(425 150)">
      <circle r="42" fill="#080B10" stroke="#7A8A9E"/>
      <circle class="pulse" r="8" fill="#7DF9FF" filter="url(#vy-glow)"/>
      <text x="0" y="60" text-anchor="middle" font-size="9.5" font-weight="700" fill="#F8FAFC">LEARNER</text>
      <text x="0" y="75" text-anchor="middle" font-size="8.5" fill="#7A8A9E" letter-spacing="1">SIGNALS</text>
    </g>
    <g transform="translate(605 150)">
      <rect x="-50" y="-50" width="100" height="100" rx="8" fill="#080B10" stroke="#00E5FF" stroke-width="1.5"/>
      <rect class="pulse" x="-9" y="-9" width="18" height="18" rx="3" fill="#00E5FF" filter="url(#vy-glow)" style="animation-delay:.35s"/>
      <text x="0" y="70" text-anchor="middle" font-size="9.5" font-weight="700" fill="#F8FAFC">ADAPTATION</text>
      <text x="0" y="85" text-anchor="middle" font-size="8.5" fill="#7A8A9E" letter-spacing="1">LOOP</text>
    </g>
    <g transform="translate(815 150)">
      <circle r="42" fill="#080B10" stroke="#7A8A9E"/>
      <circle class="pulse" r="8" fill="#7DF9FF" filter="url(#vy-glow)" style="animation-delay:.7s"/>
      <text x="0" y="60" text-anchor="middle" font-size="9.5" font-weight="700" fill="#F8FAFC">NEXT STEP</text>
      <text x="0" y="75" text-anchor="middle" font-size="8.5" fill="#7A8A9E" letter-spacing="1">INSTRUCTION</text>
    </g>
  </g>

  <rect x="1" y="252" width="918" height="47" fill="#080B10"/>
  <g class="mono">
    <text x="28" y="281" font-size="10.5" font-weight="700" fill="#00E5FF" letter-spacing="1.8">STATUS</text>
    <text x="96" y="281" font-size="11.5" font-weight="600" fill="#F8FAFC">PRIVATE DEVELOPMENT</text>
    <text x="895" y="281" text-anchor="end" font-size="9.5" fill="#7A8A9E" letter-spacing="1.1">PUBLIC DETAILS WILL FOLLOW THE LAUNCH</text>
  </g>
</svg>

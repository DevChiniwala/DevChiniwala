<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="920" height="120">
  <defs>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="920" height="120" fill="#080B10"/>

  <!-- Top gradient line -->
  <line x1="0" y1="2" x2="920" y2="2" stroke="url(#footGrad)" stroke-width="1"/>

  <!-- Status dots -->
  <g>
    <circle cx="436" cy="40" r="3" fill="#00E5FF" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="460" cy="40" r="3" fill="#00E5FF" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="484" cy="40" r="3" fill="#00E5FF" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Center text -->
  <text x="460" y="70" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#7A8A9E" letter-spacing="2">// designed as a system · built with intention</text>

  <!-- Bottom text -->
  <text x="460" y="100" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="9" fill="#7A8A9E" opacity="0.5" letter-spacing="1">DevChiniwala // AI Research OS v3.0</text>
</svg>
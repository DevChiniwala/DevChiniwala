<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Dev Chiniwala &#8212; Applied AI Engineer and AI Systems Builder</title>
  <desc id="desc">Applied AI engineer building complete systems from model behavior through data, evaluation, product, and operations.</desc>

  <defs>
    <pattern id="hero-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7A8A9E" stroke-width="0.5" opacity="0.14"/>
    </pattern>
    <linearGradient id="hero-scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="hero-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono","Fira Code","SF Mono","Cascadia Code",monospace; }
    .scan { animation: heroScan 9s linear infinite; }
    .flow { stroke-dasharray: 8 7; animation: heroFlow 2.6s linear infinite; }
    .pulse { animation: heroPulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .blink { animation: heroBlink 2.2s ease-in-out infinite; }
    .bar-a { animation: heroBars 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
    .bar-b { animation: heroBars 3.4s ease-in-out 0.55s infinite; transform-box: fill-box; transform-origin: bottom; }
    .bar-c { animation: heroBars 3.4s ease-in-out 1.1s infinite; transform-box: fill-box; transform-origin: bottom; }
    @keyframes heroScan { from { transform: translateX(-420px); } to { transform: translateX(1700px); } }
    @keyframes heroFlow { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }
    @keyframes heroPulse { 0%,100% { opacity: 0.38; transform: scale(0.82); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes heroBlink { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes heroBars { 0%,100% { transform: scaleY(0.45); opacity: 0.45; } 50% { transform: scaleY(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .scan,.flow,.pulse,.blink,.bar-a,.bar-b,.bar-c { animation: none; }
    }
  </style>

  <rect width="1280" height="400" fill="#080B10"/>
  <rect width="1280" height="400" fill="url(#hero-grid)"/>
  <rect x="1" y="1" width="1278" height="398" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.82"/>
  <rect class="scan" x="-420" y="2" width="420" height="396" fill="url(#hero-scan)"/>

  <g class="mono">
    <text x="54" y="37" font-size="10.5" font-weight="700" fill="#00E5FF" letter-spacing="3">PROFILE // APPLIED AI</text>
    <g transform="translate(1040 27)">
      <circle class="blink" cx="0" cy="5" r="4" fill="#7DF9FF" filter="url(#hero-glow)"/>
      <text x="14" y="9" font-size="9.5" font-weight="700" fill="#7A8A9E" letter-spacing="1.8">BUILDING IN PUBLIC</text>
    </g>
    <line x1="54" y1="54" x2="1226" y2="54" stroke="#7A8A9E" stroke-width="1" opacity="0.24"/>

    <text x="54" y="127" font-size="50" font-weight="900" fill="#F8FAFC" letter-spacing="7">DEV CHINIWALA</text>
    <text x="56" y="166" font-size="15.5" font-weight="700" fill="#00E5FF" letter-spacing="2.5">APPLIED AI ENGINEER &#183; AI SYSTEMS BUILDER</text>

    <text x="56" y="220" font-size="15.5" font-weight="700" fill="#F8FAFC" letter-spacing="0.35">I DON&apos;T TREAT THE MODEL AS THE PRODUCT. I BUILD THE SYSTEMS AROUND IT.</text>
    <text x="56" y="247" font-size="13.5" fill="#7A8A9E" letter-spacing="0.28">MODEL BEHAVIOR, DATA, EVALUATION, PRODUCT, AND OPERATIONS.</text>

    <g transform="translate(56 278)">
      <rect width="135" height="36" rx="4" fill="#10141D" stroke="#00E5FF" stroke-width="1"/>
      <circle class="pulse" cx="16" cy="18" r="3" fill="#7DF9FF"/>
      <text x="30" y="22" font-size="10" font-weight="700" fill="#F8FAFC" letter-spacing="1.2">AI SYSTEMS</text>
    </g>
    <g transform="translate(203 278)">
      <rect width="139" height="36" rx="4" fill="#10141D" stroke="#00E5FF" stroke-width="1"/>
      <circle class="pulse" cx="16" cy="18" r="3" fill="#7DF9FF" style="animation-delay:.45s"/>
      <text x="30" y="22" font-size="10" font-weight="700" fill="#F8FAFC" letter-spacing="1.2">EVALUATION</text>
    </g>
    <g transform="translate(354 278)">
      <rect width="158" height="36" rx="4" fill="#10141D" stroke="#00E5FF" stroke-width="1"/>
      <circle class="pulse" cx="16" cy="18" r="3" fill="#7DF9FF" style="animation-delay:.9s"/>
      <text x="30" y="22" font-size="10" font-weight="700" fill="#F8FAFC" letter-spacing="1.2">DATA + MEMORY</text>
    </g>
    <g transform="translate(524 278)">
      <rect width="190" height="36" rx="4" fill="#10141D" stroke="#00E5FF" stroke-width="1"/>
      <circle class="pulse" cx="16" cy="18" r="3" fill="#7DF9FF" style="animation-delay:1.35s"/>
      <text x="30" y="22" font-size="10" font-weight="700" fill="#F8FAFC" letter-spacing="1.2">PRODUCT ENGINEERING</text>
    </g>

    <g transform="translate(56 350)">
      <text x="0" y="0" font-size="9.5" font-weight="700" fill="#7A8A9E" letter-spacing="2">SELECTED SYSTEMS</text>
      <line x1="151" y1="-4" x2="174" y2="-4" stroke="#00E5FF" opacity="0.7"/>
      <text x="189" y="0" font-size="11" font-weight="700" fill="#F8FAFC">ControlSurface</text>
      <circle cx="306" cy="-4" r="2" fill="#00E5FF"/>
      <text x="319" y="0" font-size="11" font-weight="700" fill="#F8FAFC">MNEMOS</text>
      <circle cx="384" cy="-4" r="2" fill="#00E5FF"/>
      <text x="397" y="0" font-size="11" font-weight="700" fill="#F8FAFC">CortexOS</text>
    </g>
  </g>

  <g class="mono">
    <rect x="810" y="76" width="416" height="274" rx="6" fill="#10141D" stroke="#00E5FF" stroke-width="1.2" opacity="0.96"/>
    <text x="832" y="105" font-size="9.5" font-weight="700" fill="#7A8A9E" letter-spacing="2">END-TO-END BUILD LOOP</text>
    <text x="1204" y="105" text-anchor="end" font-size="8.5" fill="#00E5FF" letter-spacing="1.5">SYSTEMS IN MOTION</text>
    <line x1="832" y1="119" x2="1204" y2="119" stroke="#7A8A9E" opacity="0.25"/>

    <path class="flow" d="M883 173H1009M1071 173H1167M1177 194V251H1097M1035 251H929M873 241V194" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.65"/>

    <g text-anchor="middle">
      <circle cx="873" cy="173" r="31" fill="#080B10" stroke="#00E5FF" stroke-width="1.4"/>
      <circle class="pulse" cx="873" cy="173" r="6" fill="#7DF9FF" filter="url(#hero-glow)"/>
      <text x="873" y="219" font-size="8.5" font-weight="700" fill="#F8FAFC" letter-spacing="1">MODEL</text>

      <rect x="1009" y="142" width="62" height="62" rx="6" fill="#080B10" stroke="#7DF9FF" stroke-width="1.5"/>
      <rect class="pulse" x="1034" y="167" width="12" height="12" rx="2" fill="#00E5FF" filter="url(#hero-glow)" style="animation-delay:.7s"/>
      <text x="1040" y="219" font-size="8.5" font-weight="700" fill="#F8FAFC" letter-spacing="1">RUNTIME</text>

      <circle cx="1177" cy="173" r="31" fill="#080B10" stroke="#00E5FF" stroke-width="1.4"/>
      <circle class="pulse" cx="1177" cy="173" r="6" fill="#7DF9FF" filter="url(#hero-glow)" style="animation-delay:1.4s"/>
      <text x="1177" y="219" font-size="8.5" font-weight="700" fill="#F8FAFC" letter-spacing="1">PRODUCT</text>

      <circle cx="873" cy="251" r="24" fill="#080B10" stroke="#00E5FF" stroke-width="1.2"/>
      <circle class="pulse" cx="873" cy="251" r="4" fill="#7DF9FF" style="animation-delay:2.1s"/>
      <text x="873" y="289" font-size="8.5" font-weight="700" fill="#F8FAFC" letter-spacing="1">DATA</text>

      <circle cx="1066" cy="251" r="24" fill="#080B10" stroke="#00E5FF" stroke-width="1.2"/>
      <circle class="pulse" cx="1066" cy="251" r="4" fill="#7DF9FF" style="animation-delay:2.45s"/>
      <text x="1066" y="289" font-size="8.5" font-weight="700" fill="#F8FAFC" letter-spacing="1">EVALUATE</text>
    </g>

    <g transform="translate(1130 245)">
      <rect x="0" y="22" width="8" height="18" fill="#00E5FF" opacity="0.6" class="bar-a"/>
      <rect x="14" y="12" width="8" height="28" fill="#00E5FF" opacity="0.72" class="bar-b"/>
      <rect x="28" y="0" width="8" height="40" fill="#7DF9FF" opacity="0.9" class="bar-c"/>
      <text x="18" y="58" text-anchor="middle" font-size="7.5" fill="#7A8A9E" letter-spacing="1">ITERATE</text>
    </g>

    <rect x="832" y="312" width="372" height="22" rx="3" fill="#080B10" stroke="#00E5FF" stroke-opacity="0.3"/>
    <circle class="blink" cx="847" cy="323" r="3" fill="#7DF9FF"/>
    <text x="859" y="327" font-size="8.5" fill="#7A8A9E" letter-spacing="1.1">BUILD &#8594; INSTRUMENT &#8594; EVALUATE &#8594; IMPROVE</text>
  </g>
</svg>

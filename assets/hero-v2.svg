<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Dev Chiniwala — Applied AI Engineer and AI Systems Builder</title>
  <desc id="desc">Profile banner focused on reliable agents, temporal memory, and evidence-backed automation.</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7A8A9E" stroke-width="0.5" opacity="0.16"/>
    </pattern>
    <linearGradient id="scan-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',monospace; }
    .scan { animation: scan 8s linear infinite; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .flow { animation: flow 2.8s linear infinite; }
    @keyframes scan {
      from { transform: translateX(-420px); }
      to { transform: translateX(1280px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.45; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes flow {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scan, .pulse, .flow { animation: none; }
    }
  </style>

  <rect width="1280" height="320" fill="#080B10"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="318.5" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.8"/>
  <rect class="scan" x="-420" y="1" width="420" height="318" fill="url(#scan-gradient)"/>

  <g class="mono">
    <text x="52" y="35" font-size="10" font-weight="700" fill="#00E5FF" letter-spacing="3">PROFILE // APPLIED AI</text>
    <text x="1228" y="35" text-anchor="end" font-size="10" fill="#7A8A9E" letter-spacing="2">BUILD · MEASURE · IMPROVE</text>
    <line x1="52" y1="51" x2="1228" y2="51" stroke="#10141D" stroke-width="2"/>

    <text x="52" y="116" font-size="48" font-weight="900" fill="#F8FAFC" letter-spacing="7">DEV CHINIWALA</text>
    <text x="54" y="151" font-size="15" font-weight="700" fill="#00E5FF" letter-spacing="2.6">APPLIED AI ENGINEER · AI SYSTEMS BUILDER</text>

    <text x="54" y="198" font-size="15" fill="#F8FAFC" letter-spacing="0.35">Building reliable agents, temporal memory,</text>
    <text x="54" y="222" font-size="15" fill="#F8FAFC" letter-spacing="0.35">and evidence-backed automation.</text>

    <g transform="translate(54 252)">
      <rect width="166" height="30" rx="3" fill="#10141D" stroke="#00E5FF" stroke-width="1" opacity="0.96"/>
      <circle cx="15" cy="15" r="3" fill="#7DF9FF"/>
      <text x="28" y="19" font-size="10" font-weight="700" fill="#F8FAFC" letter-spacing="1.1">RELIABLE AGENTS</text>
    </g>
    <g transform="translate(232 252)">
      <rect width="178" height="30" rx="3" fill="#10141D" stroke="#00E5FF" stroke-width="1" opacity="0.96"/>
      <circle cx="15" cy="15" r="3" fill="#7DF9FF"/>
      <text x="28" y="19" font-size="10" font-weight="700" fill="#F8FAFC" letter-spacing="1.1">TEMPORAL MEMORY</text>
    </g>
    <g transform="translate(422 252)">
      <rect width="258" height="30" rx="3" fill="#10141D" stroke="#00E5FF" stroke-width="1" opacity="0.96"/>
      <circle cx="15" cy="15" r="3" fill="#7DF9FF"/>
      <text x="28" y="19" font-size="10" font-weight="700" fill="#F8FAFC" letter-spacing="1.1">EVIDENCE-BACKED AUTOMATION</text>
    </g>
  </g>

  <g transform="translate(900 75)" class="mono">
    <rect width="328" height="207" rx="4" fill="#10141D" stroke="#00E5FF" stroke-width="1" opacity="0.88"/>
    <text x="18" y="28" font-size="9" font-weight="700" fill="#7A8A9E" letter-spacing="2">SYSTEM QUALITIES</text>
    <line x1="18" y1="41" x2="310" y2="41" stroke="#7A8A9E" stroke-width="1" opacity="0.25"/>

    <path class="flow" d="M64 82H164V124H264" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.65"/>
    <path class="flow" d="M64 158H164V124" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.65"/>

    <g transform="translate(64 82)">
      <circle r="27" fill="#080B10" stroke="#00E5FF" stroke-width="1.5"/>
      <circle class="pulse" r="5" fill="#7DF9FF" filter="url(#soft-glow)"/>
      <text x="0" y="45" text-anchor="middle" font-size="8" fill="#F8FAFC" letter-spacing="1">RELIABLE</text>
    </g>
    <g transform="translate(64 158)">
      <circle r="27" fill="#080B10" stroke="#00E5FF" stroke-width="1.5"/>
      <circle class="pulse" r="5" fill="#7DF9FF" filter="url(#soft-glow)" style="animation-delay:0.8s"/>
      <text x="0" y="45" text-anchor="middle" font-size="8" fill="#F8FAFC" letter-spacing="1">TEMPORAL</text>
    </g>
    <g transform="translate(164 124)">
      <rect x="-30" y="-30" width="60" height="60" rx="4" fill="#080B10" stroke="#7DF9FF" stroke-width="1.5"/>
      <circle class="pulse" r="6" fill="#00E5FF" filter="url(#soft-glow)" style="animation-delay:1.5s"/>
      <text x="0" y="48" text-anchor="middle" font-size="8" fill="#F8FAFC" letter-spacing="1">SYSTEM</text>
    </g>
    <g transform="translate(264 124)">
      <circle r="27" fill="#080B10" stroke="#00E5FF" stroke-width="1.5"/>
      <circle class="pulse" r="5" fill="#7DF9FF" filter="url(#soft-glow)" style="animation-delay:2.2s"/>
      <text x="0" y="45" text-anchor="middle" font-size="8" fill="#F8FAFC" letter-spacing="1">VERIFIABLE</text>
    </g>
  </g>
</svg>

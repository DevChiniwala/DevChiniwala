<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 280" width="450" height="280">
  <!-- Background -->
  <rect width="450" height="280" fill="#080B10"/>
  <rect x="1" y="1" width="448" height="278" fill="#10141D" stroke="#00E5FF" stroke-width="1"/>

  <!-- Header -->
  <rect x="1" y="1" width="448" height="36" fill="#080B10"/>
  <line x1="1" y1="37" x2="449" y2="37" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="16" y="24" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="9" fill="#7A8A9E" letter-spacing="2">SYSTEM // 04</text>
  <circle cx="408" cy="19" r="3" fill="#00E5FF">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="416" y="22" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="9" fill="#00E5FF" letter-spacing="1">LIVE</text>

  <!-- Project -->
  <text x="24" y="72" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="24" font-weight="900" fill="#F8FAFC" letter-spacing="3">VYGOT</text>
  <text x="24" y="94" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="11" fill="#7A8A9E" letter-spacing="1">Cognitive Learning Intelligence Platform</text>

  <!-- Description -->
  <text x="24" y="126" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#7A8A9E">Knowledge tracing and adaptive learning</text>
  <text x="24" y="142" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#7A8A9E">with psychometrics and Bayesian models.</text>

  <!-- Tags -->
  <g font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="9" fill="#F8FAFC">
    <rect x="24" y="162" width="108" height="20" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="34" y="176">Psychometrics</text>
    <rect x="140" y="162" width="114" height="20" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="150" y="176">Knowledge Trace</text>
    <rect x="262" y="162" width="80" height="20" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="272" y="176">Adaptive</text>
    <rect x="350" y="162" width="80" height="20" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="360" y="176">Bayesian</text>
  </g>

  <!-- Bottom stack -->
  <line x1="24" y1="200" x2="426" y2="200" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <g font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#7A8A9E">
    <text x="24" y="225">Python</text>
    <circle cx="68" cy="221" r="2" fill="#00E5FF" opacity="0.5"/>
    <text x="76" y="225">FastAPI</text>
    <circle cx="128" cy="221" r="2" fill="#00E5FF" opacity="0.5"/>
    <text x="136" y="225">Neo4j</text>
    <circle cx="174" cy="221" r="2" fill="#00E5FF" opacity="0.5"/>
    <text x="182" y="225">Gemini</text>
  </g>

  <!-- Corner accents -->
  <g stroke="#00E5FF" stroke-width="1" opacity="0.25" fill="none">
    <path d="M 6,6 L 6,18"/><path d="M 6,6 L 18,6"/>
    <path d="M 444,6 L 444,18"/><path d="M 444,6 L 432,6"/>
    <path d="M 6,274 L 6,262"/><path d="M 6,274 L 18,274"/>
    <path d="M 444,274 L 444,262"/><path d="M 444,274 L 432,274"/>
  </g>
</svg>
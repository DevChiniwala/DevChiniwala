<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="920" height="200">
  <!-- Background -->
  <rect width="920" height="200" fill="#080B10"/>

  <!-- Section header -->
  <text x="24" y="30" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#00E5FF" letter-spacing="3" font-weight="700">06 // CURRENT RESEARCH</text>
  <line x1="24" y1="42" x2="230" y2="42" stroke="#00E5FF" stroke-width="1" opacity="0.3"/>
  <text x="250" y="30" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="9" fill="#7A8A9E" letter-spacing="1">ACTIVE EXPERIMENTS</text>

  <!-- Row 1 -->
  <g font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="12" fill="#F8FAFC">
    <!-- GraphRAG -->
    <circle cx="46" cy="72" r="4" fill="#00E5FF" opacity="0.6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <text x="60" y="76">GraphRAG</text>

    <!-- Long Context -->
    <circle cx="196" cy="72" r="4" fill="#00E5FF" opacity="0.6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <text x="210" y="76">Long Context</text>

    <!-- Context Compression -->
    <circle cx="376" cy="72" r="4" fill="#00E5FF" opacity="0.6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="390" y="76">Context Compression</text>

    <!-- KG Memory -->
    <circle cx="596" cy="72" r="4" fill="#00E5FF" opacity="0.6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <text x="610" y="76">Knowledge Graph Memory</text>
  </g>

  <!-- Row 2 -->
  <g font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="12" fill="#F8FAFC">
    <!-- Adaptive Learning -->
    <circle cx="46" cy="120" r="4" fill="#00E5FF" opacity="0.6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="60" y="124">Adaptive Learning</text>

    <!-- LLM Evaluation -->
    <circle cx="246" cy="120" r="4" fill="#00E5FF" opacity="0.6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="260" y="124">LLM Evaluation</text>

    <!-- Reasoning Chains -->
    <circle cx="436" cy="120" r="4" fill="#00E5FF" opacity="0.6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="450" y="124">Reasoning Chains</text>

    <!-- Synthetic Data -->
    <circle cx="636" cy="120" r="4" fill="#00E5FF" opacity="0.6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <text x="650" y="124">Synthetic Data</text>
  </g>

  <!-- Status line -->
  <text x="24" y="170" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="9" fill="#7A8A9E" letter-spacing="1">8 ACTIVE RESEARCH THREADS // UPDATED 2025</text>
</svg>
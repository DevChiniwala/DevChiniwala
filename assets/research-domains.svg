    <text x="370" y="120" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="9" fill="#00E5FF" letter-spacing="2" font-weight="700">KNOWLEDGE &amp; AGENTS</text>

    <rect x="350" y="130" width="140" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <text x="366" y="147" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Knowledge Graphs</text>

    <rect x="350" y="162" width="110" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text x="366" y="179" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Agentic AI</text>

    <rect x="350" y="194" width="140" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="366" y="211" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Memory Systems</text>

    <rect x="350" y="226" width="120" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
    <text x="366" y="243" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Long Context</text>
  </g>


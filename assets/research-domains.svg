    <text x="670" y="120" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="9" fill="#00E5FF" letter-spacing="2" font-weight="700">REASONING</text>

    <rect x="650" y="130" width="170" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <text x="666" y="147" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Context Engineering</text>

    <rect x="650" y="162" width="110" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="0.7s" repeatCount="indefinite"/>
    </rect>
    <text x="666" y="179" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Reasoning</text>

    <rect x="650" y="194" width="110" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="666" y="211" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Evaluation</text>

    <rect x="650" y="226" width="160" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="666" y="243" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Prompt Engineering</text>
  </g>

  <!-- Inter-cluster connections (horizontal) -->
  <g stroke="#00E5FF" stroke-width="0.5" fill="none" stroke-dasharray="3 4" opacity="0.2">
    <path d="M 250,175 L 345,175">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 500,175 L 645,175">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Divider line -->
  <line x1="40" y1="275" x2="880" y2="275" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- CLUSTER 4: Engineering (bottom-left) -->
  <g>
    <text x="60" y="300" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="9" fill="#00E5FF" letter-spacing="2" font-weight="700">ENGINEERING</text>

    <rect x="40" y="310" width="130" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <text x="56" y="327" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Model Routing</text>

    <rect x="40" y="342" width="130" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text x="56" y="359" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Synthetic Data</text>

    <rect x="40" y="374" width="140" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="56" y="391" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Explainable AI</text>
  </g>

  <!-- CLUSTER 5: Learning Science (bottom-right) -->
  <g>
    <text x="540" y="300" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="9" fill="#00E5FF" letter-spacing="2" font-weight="700">LEARNING SCIENCE</text>

    <rect x="520" y="310" width="150" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <text x="536" y="327" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Learning Analytics</text>

    <rect x="520" y="342" width="130" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="536" y="359" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Psychometrics</text>

    <rect x="520" y="374" width="160" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="536" y="391" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Adaptive Learning</text>

    <rect x="520" y="406" width="210" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="536" y="423" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Bayesian Knowledge Tracing</text>
  </g>

  <!-- Bottom connection lines -->
  <g stroke="#00E5FF" stroke-width="0.5" fill="none" stroke-dasharray="3 4" opacity="0.2">
    <path d="M 185,360 L 515,360">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Node count indicator -->
  <text x="820" y="460" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="9" fill="#7A8A9E" text-anchor="end">19 ACTIVE DOMAINS</text>
</svg>
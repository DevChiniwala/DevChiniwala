<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes nodeP1 { 0%,100% { opacity:0.4; } 50% { opacity:1; } }
    @keyframes nodeP2 { 0%,100% { opacity:0.4; } 50% { opacity:1; } }
    @keyframes flowLine { to { stroke-dashoffset: 0; } }
  </style>

  <!-- Background -->
  <rect width="920" height="480" fill="#080B10"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="80" x2="920" y2="80"/>
    <line x1="0" y1="160" x2="920" y2="160"/>
    <line x1="0" y1="240" x2="920" y2="240"/>
    <line x1="0" y1="320" x2="920" y2="320"/>
    <line x1="0" y1="400" x2="920" y2="400"/>
    <line x1="184" y1="0" x2="184" y2="480"/>
    <line x1="368" y1="0" x2="368" y2="480"/>
    <line x1="552" y1="0" x2="552" y2="480"/>
    <line x1="736" y1="0" x2="736" y2="480"/>
  </g>

  <!-- Section header -->
  <text x="24" y="30" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#00E5FF" letter-spacing="3" font-weight="700">02 // RESEARCH DOMAINS</text>
  <line x1="24" y1="42" x2="250" y2="42" stroke="#00E5FF" stroke-width="1" opacity="0.3"/>

  <!-- Central node -->
  <rect x="370" y="55" width="180" height="30" rx="2" fill="#10141D" stroke="#00E5FF" stroke-width="1.5" filter="url(#glow)"/>
  <text x="460" y="75" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="11" fill="#00E5FF" font-weight="700" letter-spacing="1">RESEARCH MAP</text>

  <!-- Connection lines from center -->
  <g stroke="#00E5FF" stroke-width="0.8" fill="none" stroke-dasharray="4 3" opacity="0.3">
    <path d="M 460,85 L 160,120">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 460,85 L 460,120">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 460,85 L 760,120">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- CLUSTER 1: LLM & Retrieval (top-left) -->
  <g style="animation: nodeP1 4s ease-in-out infinite;">
    <text x="60" y="120" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="9" fill="#00E5FF" letter-spacing="2" font-weight="700">LLM &amp; RETRIEVAL</text>

    <rect x="40" y="130" width="120" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="56" y="147" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Large Language Models</text>

    <rect x="40" y="162" width="200" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <text x="56" y="179" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Retrieval-Augmented Generation</text>

    <rect x="40" y="194" width="100" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="56" y="211" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">GraphRAG</text>

    <rect x="40" y="226" width="130" height="26" rx="2" fill="#10141D" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="56" y="243" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#F8FAFC">Hybrid Search</text>
  </g>

  <!-- CLUSTER 2: Knowledge & Agents (top-center) -->

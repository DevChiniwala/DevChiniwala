<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="920" height="200">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="920" height="200" fill="#080B10"/>

  <!-- Section header -->
  <text x="24" y="30" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="10" fill="#00E5FF" letter-spacing="3" font-weight="700">07 // PROJECT ROADMAP</text>
  <line x1="24" y1="42" x2="220" y2="42" stroke="#00E5FF" stroke-width="1" opacity="0.3"/>

  <!-- Timeline base line -->
  <line x1="80" y1="100" x2="840" y2="100" stroke="#00E5FF" stroke-width="1" opacity="0.2" stroke-dasharray="4 2"/>

  <!-- Milestones -->
  <g font-family="'JetBrains Mono','Fira Code','SF Mono',monospace">

    <!-- PagePilot -->
    <circle cx="140" cy="100" r="6" fill="#10141D" stroke="#00E5FF" stroke-width="1.5">
      <animate attributeName="r" values="5;7;5" dur="3s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <text x="140" y="78" text-anchor="middle" font-size="11" fill="#F8FAFC" font-weight="700">PagePilot</text>
    <text x="140" y="125" text-anchor="middle" font-size="9" fill="#7A8A9E">SHIPPED</text>

    <!-- VYGOT -->
    <circle cx="320" cy="100" r="6" fill="#10141D" stroke="#00E5FF" stroke-width="1.5">
      <animate attributeName="r" values="5;7;5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <text x="320" y="78" text-anchor="middle" font-size="11" fill="#F8FAFC" font-weight="700">VYGOT</text>
    <text x="320" y="125" text-anchor="middle" font-size="9" fill="#7A8A9E">IN PROGRESS</text>

    <!-- AegisOS -->
    <circle cx="500" cy="100" r="6" fill="#10141D" stroke="#00E5FF" stroke-width="1.5">
      <animate attributeName="r" values="5;7;5" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="500" y="78" text-anchor="middle" font-size="11" fill="#F8FAFC" font-weight="700">AegisOS</text>
    <text x="500" y="125" text-anchor="middle" font-size="9" fill="#7A8A9E">ACTIVE</text>

    <!-- Research Papers -->
    <circle cx="680" cy="100" r="6" fill="#10141D" stroke="#00E5FF" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="5;7;5" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="680" y="78" text-anchor="middle" font-size="11" fill="#F8FAFC" font-weight="700" opacity="0.6">Research</text>
    <text x="680" y="125" text-anchor="middle" font-size="9" fill="#7A8A9E">PLANNED</text>

    <!-- Open Source -->
    <circle cx="840" cy="100" r="6" fill="#10141D" stroke="#00E5FF" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="5;7;5" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="840" y="78" text-anchor="middle" font-size="11" fill="#F8FAFC" font-weight="700" opacity="0.4">Open Source</text>
    <text x="840" y="125" text-anchor="middle" font-size="9" fill="#7A8A9E">2025+</text>
  </g>

  <!-- Traveling dot -->
  <circle r="4" fill="#7DF9FF" opacity="0.9">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 80,100 L 840,100"/>
  </circle>

  <!-- Progress indicator -->
  <text x="24" y="170" font-family="'JetBrains Mono','Fira Code','SF Mono',monospace" font-size="9" fill="#7A8A9E" letter-spacing="1">PROGRESS: 3/5 MILESTONES ACTIVE</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" width="920" height="510" role="img" aria-labelledby="title desc">
  <title id="title">Dev Chiniwala engineering stack</title>
  <desc id="desc">Selected tools and practices grouped into core engineering, agents and AI, memory and data, and reliability and delivery.</desc>

  <defs>
    <pattern id="stack-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7A8A9E" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    <filter id="stack-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="stack-scan" x1="0" x2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00E5FF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',monospace; }
    .group { font-size: 14px; font-weight: 800; fill: #00E5FF; letter-spacing: 1.8px; }
    .tools { font-size: 11px; font-weight: 600; fill: #F8FAFC; letter-spacing: 0.3px; }
    .practice { font-size: 9px; font-weight: 800; fill: #7DF9FF; letter-spacing: 1px; }
    .index { font-size: 10px; font-weight: 700; fill: #7A8A9E; letter-spacing: 1px; }
    .flow { animation: stack-flow 3.6s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: stack-pulse 2.4s ease-in-out infinite; }
    .scan { animation: stack-scan 9s ease-in-out infinite; }
    @keyframes stack-flow { to { stroke-dashoffset: -36; } }
    @keyframes stack-pulse { 0%,100% { opacity:.35; transform:scale(.8); } 50% { opacity:1; transform:scale(1.2); } }
    @keyframes stack-scan { 0%,15% { transform:translateX(-240px); } 75%,100% { transform:translateX(1160px); } }
    @media (prefers-reduced-motion: reduce) { .flow,.pulse,.scan { animation:none; } }
  </style>

  <rect width="920" height="510" fill="#080B10"/>
  <rect width="920" height="510" fill="url(#stack-grid)"/>
  <rect x=".75" y=".75" width="918.5" height="508.5" fill="none" stroke="#00E5FF" stroke-width="1.5"/>
  <rect class="scan" x="-240" y="1" width="240" height="508" fill="url(#stack-scan)"/>

  <g class="mono">
    <text x="26" y="36" font-size="14" font-weight="800" fill="#00E5FF" letter-spacing="2.5">STACK // SHIPPED AI SYSTEMS</text>
    <text x="894" y="36" text-anchor="end" font-size="9" fill="#7A8A9E" letter-spacing="1.5">BUILD · EVALUATE · OPERATE</text>
    <text x="26" y="66" font-size="12" fill="#F8FAFC">The tools I use across model workflows, product runtimes, data systems, and delivery.</text>
    <line x1="26" y1="84" x2="894" y2="84" stroke="#7A8A9E" opacity=".25"/>

    <g transform="translate(24 102)">
      <rect width="428" height="180" rx="5" fill="#10141D" stroke="#7A8A9E"/>
      <rect width="5" height="180" rx="2.5" fill="#00E5FF"/>
      <text class="index" x="402" y="25" text-anchor="end">01 / RUNTIME</text>
      <text class="group" x="24" y="37">CORE ENGINEERING</text>
      <path class="flow" d="M326 44H398" fill="none" stroke="#00E5FF" stroke-dasharray="5 7" opacity=".45"/>
      <circle class="pulse" cx="399" cy="44" r="4" fill="#00E5FF" filter="url(#stack-glow)"/>
      <line x1="24" y1="58" x2="404" y2="58" stroke="#7A8A9E" opacity=".22"/>
      <text class="tools" x="24" y="88">Python · TypeScript · Rust · SQL</text>
      <text class="tools" x="24" y="116">FastAPI · React · Next.js · Tauri</text>
      <rect x="24" y="139" width="250" height="24" rx="3" fill="#080B10" stroke="#00E5FF" opacity=".75"/>
      <text class="practice" x="38" y="155">SERVICE · WEB · DESKTOP SYSTEMS</text>
    </g>

    <g transform="translate(468 102)">
      <rect width="428" height="180" rx="5" fill="#10141D" stroke="#7A8A9E"/>
      <rect width="5" height="180" rx="2.5" fill="#00E5FF"/>
      <text class="index" x="402" y="25" text-anchor="end">02 / INTELLIGENCE</text>
      <text class="group" x="24" y="37">AGENTS &amp; AI</text>
      <path class="flow" d="M326 44H398" fill="none" stroke="#00E5FF" stroke-dasharray="5 7" opacity=".45" style="animation-delay:.4s"/>
      <circle class="pulse" cx="399" cy="44" r="4" fill="#00E5FF" filter="url(#stack-glow)" style="animation-delay:.4s"/>
      <line x1="24" y1="58" x2="404" y2="58" stroke="#7A8A9E" opacity=".22"/>
      <text class="tools" x="24" y="88">Claude Agent SDK · MCP · OpenAI · Gemini</text>
      <text class="tools" x="24" y="116">RAG · tool calling · model evaluation</text>
      <rect x="24" y="139" width="278" height="24" rx="3" fill="#080B10" stroke="#00E5FF" opacity=".75"/>
      <text class="practice" x="38" y="155">TOOLS · ROUTING · EVIDENCE · GUARDRAILS</text>
    </g>

    <g transform="translate(24 298)">
      <rect width="428" height="180" rx="5" fill="#10141D" stroke="#7A8A9E"/>
      <rect width="5" height="180" rx="2.5" fill="#00E5FF"/>
      <text class="index" x="402" y="25" text-anchor="end">03 / STATE</text>
      <text class="group" x="24" y="37">MEMORY &amp; DATA</text>
      <path class="flow" d="M326 44H398" fill="none" stroke="#00E5FF" stroke-dasharray="5 7" opacity=".45" style="animation-delay:.8s"/>
      <circle class="pulse" cx="399" cy="44" r="4" fill="#00E5FF" filter="url(#stack-glow)" style="animation-delay:.8s"/>
      <line x1="24" y1="58" x2="404" y2="58" stroke="#7A8A9E" opacity=".22"/>
      <text class="tools" x="24" y="86">Hybrid retrieval · BM25 · knowledge graphs</text>
      <text class="tools" x="24" y="113">PostgreSQL · ClickHouse · Neo4j · SQLite</text>
      <text class="tools" x="24" y="140">Temporal state · bounded context</text>
      <text class="practice" x="24" y="163">TRACEABLE CONTEXT · DURABLE STATE</text>
    </g>

    <g transform="translate(468 298)">
      <rect width="428" height="180" rx="5" fill="#10141D" stroke="#7A8A9E"/>
      <rect width="5" height="180" rx="2.5" fill="#00E5FF"/>
      <text class="index" x="402" y="25" text-anchor="end">04 / DELIVERY</text>
      <text class="group" x="24" y="37">RELIABILITY &amp; DELIVERY</text>
      <path class="flow" d="M326 44H398" fill="none" stroke="#00E5FF" stroke-dasharray="5 7" opacity=".45" style="animation-delay:1.2s"/>
      <circle class="pulse" cx="399" cy="44" r="4" fill="#00E5FF" filter="url(#stack-glow)" style="animation-delay:1.2s"/>
      <line x1="24" y1="58" x2="404" y2="58" stroke="#7A8A9E" opacity=".22"/>
      <text class="tools" x="24" y="86">OpenTelemetry · regression tests · release gates</text>
      <text class="tools" x="24" y="113">Docker Compose · GitHub Actions · Playwright</text>
      <text class="tools" x="24" y="140">Observability · incident intelligence</text>
      <text class="practice" x="24" y="163">MEASURED · REVIEWABLE · DEPLOYABLE</text>
    </g>
  </g>
</svg>

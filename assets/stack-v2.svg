<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 766" width="920" height="766" role="img" aria-labelledby="title desc">
  <title id="title">Dev Chiniwala engineering stack</title>
  <desc id="desc">An expanded operating stack across languages, models and AI, agents and context, runtime and product, data and memory, and infrastructure and reliability.</desc>

  <defs>
    <pattern id="stack-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7A8A9E" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    <filter id="stack-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="stack-scan" x1="0" x2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00E5FF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',monospace; }
    .group { font-size: 13.5px; font-weight: 800; fill: #00E5FF; letter-spacing: 1.55px; }
    .tools { font-size: 10.4px; font-weight: 600; fill: #F8FAFC; letter-spacing: 0.18px; }
    .practice { font-size: 8.5px; font-weight: 800; fill: #7DF9FF; letter-spacing: 0.9px; }
    .index { font-size: 9.5px; font-weight: 700; fill: #7A8A9E; letter-spacing: 1px; }
    .flow { animation: stack-flow 3.6s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: stack-pulse 2.4s ease-in-out infinite; }
    .scan { animation: stack-scan 9s ease-in-out infinite; }
    @keyframes stack-flow { to { stroke-dashoffset: -36; } }
    @keyframes stack-pulse { 0%,100% { opacity:.35; transform:scale(.8); } 50% { opacity:1; transform:scale(1.2); } }
    @keyframes stack-scan { 0%,15% { transform:translateX(-240px); } 75%,100% { transform:translateX(1160px); } }
    @media (prefers-reduced-motion: reduce) { .flow,.pulse,.scan { animation:none; } }
  </style>

  <rect width="920" height="766" fill="#080B10"/>
  <rect width="920" height="766" fill="url(#stack-grid)"/>
  <rect x=".75" y=".75" width="918.5" height="764.5" fill="none" stroke="#00E5FF" stroke-width="1.5"/>
  <rect class="scan" x="-240" y="1" width="240" height="764" fill="url(#stack-scan)"/>

  <g class="mono">
    <text x="26" y="36" font-size="14" font-weight="800" fill="#00E5FF" letter-spacing="2.5">STACK // SHIPPED AI SYSTEMS</text>
    <text x="894" y="36" text-anchor="end" font-size="9" fill="#7A8A9E" letter-spacing="1.5">06 DOMAINS &#183; ONE OPERATING STACK</text>
    <text x="26" y="66" font-size="12" fill="#F8FAFC">Languages, model infrastructure, product runtimes, data systems, and delivery.</text>
    <line x1="26" y1="84" x2="894" y2="84" stroke="#7A8A9E" opacity=".25"/>

    <g transform="translate(20 102)">
      <rect width="432" height="200" rx="6" fill="#10141D" stroke="#7A8A9E"/>
      <rect width="5" height="200" rx="2.5" fill="#00E5FF"/>
      <text class="index" x="406" y="25" text-anchor="end">01 / FOUNDATIONS</text>
      <text class="group" x="24" y="38">LANGUAGES &amp; CORE</text>
      <path class="flow" d="M326 45H402" fill="none" stroke="#00E5FF" stroke-dasharray="5 7" opacity=".45"/>
      <circle class="pulse" cx="403" cy="45" r="4" fill="#00E5FF" filter="url(#stack-glow)"/>
      <line x1="24" y1="60" x2="408" y2="60" stroke="#7A8A9E" opacity=".22"/>
      <text class="tools" x="24" y="91">Python &#183; Rust &#183; C++ &#183; TypeScript</text>
      <text class="tools" x="24" y="121">Go &#183; Lua &#183; SQL</text>
      <rect x="24" y="153" width="236" height="25" rx="3" fill="#080B10" stroke="#00E5FF" opacity=".78"/>
      <text class="practice" x="38" y="170">SYSTEMS &#183; SERVICES &#183; PRODUCT</text>
    </g>

    <g transform="translate(468 102)">
      <rect width="432" height="200" rx="6" fill="#10141D" stroke="#7A8A9E"/>
      <rect width="5" height="200" rx="2.5" fill="#00E5FF"/>
      <text class="index" x="406" y="25" text-anchor="end">02 / INTELLIGENCE</text>
      <text class="group" x="24" y="38">MODELS &amp; AI</text>
      <path class="flow" d="M326 45H402" fill="none" stroke="#00E5FF" stroke-dasharray="5 7" opacity=".45" style="animation-delay:.25s"/>
      <circle class="pulse" cx="403" cy="45" r="4" fill="#00E5FF" filter="url(#stack-glow)" style="animation-delay:.25s"/>
      <line x1="24" y1="60" x2="408" y2="60" stroke="#7A8A9E" opacity=".22"/>
      <text class="tools" x="24" y="87">PyTorch &#183; TensorFlow &#183; CUDA &#183; JAX</text>
      <text class="tools" x="24" y="113">Triton &#183; ONNX &#183; Hugging Face</text>
      <text class="tools" x="24" y="139">OpenAI &#183; Anthropic &#183; Gemini</text>
      <rect x="24" y="158" width="213" height="25" rx="3" fill="#080B10" stroke="#00E5FF" opacity=".78"/>
      <text class="practice" x="38" y="175">TRAIN &#183; INFER &#183; EVALUATE</text>
    </g>

    <g transform="translate(20 318)">
      <rect width="432" height="200" rx="6" fill="#10141D" stroke="#7A8A9E"/>
      <rect width="5" height="200" rx="2.5" fill="#00E5FF"/>
      <text class="index" x="406" y="25" text-anchor="end">03 / ORCHESTRATION</text>
      <text class="group" x="24" y="38">AGENTS &amp; CONTEXT</text>
      <path class="flow" d="M326 45H402" fill="none" stroke="#00E5FF" stroke-dasharray="5 7" opacity=".45" style="animation-delay:.5s"/>
      <circle class="pulse" cx="403" cy="45" r="4" fill="#00E5FF" filter="url(#stack-glow)" style="animation-delay:.5s"/>
      <line x1="24" y1="60" x2="408" y2="60" stroke="#7A8A9E" opacity=".22"/>
      <text class="tools" x="24" y="87">Claude Agent SDK &#183; MCP &#183; RAG &#183; tool calling</text>
      <text class="tools" x="24" y="113">Hybrid retrieval &#183; BM25 &#183; knowledge graphs</text>
      <text class="tools" x="24" y="139">model evaluation &#183; evidence-backed routing</text>
      <rect x="24" y="158" width="304" height="25" rx="3" fill="#080B10" stroke="#00E5FF" opacity=".78"/>
      <text class="practice" x="38" y="175">TOOLS &#183; ROUTING &#183; EVIDENCE &#183; GUARDRAILS</text>
    </g>

    <g transform="translate(468 318)">
      <rect width="432" height="200" rx="6" fill="#10141D" stroke="#7A8A9E"/>
      <rect width="5" height="200" rx="2.5" fill="#00E5FF"/>
      <text class="index" x="406" y="25" text-anchor="end">04 / EXECUTION</text>
      <text class="group" x="24" y="38">RUNTIME &amp; PRODUCT</text>
      <path class="flow" d="M326 45H402" fill="none" stroke="#00E5FF" stroke-dasharray="5 7" opacity=".45" style="animation-delay:.75s"/>
      <circle class="pulse" cx="403" cy="45" r="4" fill="#00E5FF" filter="url(#stack-glow)" style="animation-delay:.75s"/>
      <line x1="24" y1="60" x2="408" y2="60" stroke="#7A8A9E" opacity=".22"/>
      <text class="tools" x="24" y="87">Ray &#183; FastAPI &#183; vLLM &#183; SGLang</text>
      <text class="tools" x="24" y="113">Docker &#183; Kubernetes &#183; MLflow &#183; Jupyter</text>
      <text class="tools" x="24" y="139">React &#183; Next.js &#183; Tauri</text>
      <rect x="24" y="158" width="266" height="25" rx="3" fill="#080B10" stroke="#00E5FF" opacity=".78"/>
      <text class="practice" x="38" y="175">SERVICE &#183; WEB &#183; DESKTOP SYSTEMS</text>
    </g>

    <g transform="translate(20 534)">
      <rect width="432" height="200" rx="6" fill="#10141D" stroke="#7A8A9E"/>
      <rect width="5" height="200" rx="2.5" fill="#00E5FF"/>
      <text class="index" x="406" y="25" text-anchor="end">05 / STATE</text>
      <text class="group" x="24" y="38">DATA &amp; MEMORY</text>
      <path class="flow" d="M326 45H402" fill="none" stroke="#00E5FF" stroke-dasharray="5 7" opacity=".45" style="animation-delay:1s"/>
      <circle class="pulse" cx="403" cy="45" r="4" fill="#00E5FF" filter="url(#stack-glow)" style="animation-delay:1s"/>
      <line x1="24" y1="60" x2="408" y2="60" stroke="#7A8A9E" opacity=".22"/>
      <text class="tools" x="24" y="91">PostgreSQL &#183; ClickHouse &#183; Neo4j &#183; SQLite</text>
      <text class="tools" x="24" y="121">Redis &#183; temporal state &#183; bounded context</text>
      <rect x="24" y="153" width="275" height="25" rx="3" fill="#080B10" stroke="#00E5FF" opacity=".78"/>
      <text class="practice" x="38" y="170">TRACEABLE CONTEXT &#183; DURABLE STATE</text>
    </g>

    <g transform="translate(468 534)">
      <rect width="432" height="200" rx="6" fill="#10141D" stroke="#7A8A9E"/>
      <rect width="5" height="200" rx="2.5" fill="#00E5FF"/>
      <text class="index" x="406" y="25" text-anchor="end">06 / DELIVERY</text>
      <text class="group" x="24" y="38">INFRA &amp; RELIABILITY</text>
      <path class="flow" d="M326 45H402" fill="none" stroke="#00E5FF" stroke-dasharray="5 7" opacity=".45" style="animation-delay:1.25s"/>
      <circle class="pulse" cx="403" cy="45" r="4" fill="#00E5FF" filter="url(#stack-glow)" style="animation-delay:1.25s"/>
      <line x1="24" y1="60" x2="408" y2="60" stroke="#7A8A9E" opacity=".22"/>
      <text class="tools" x="24" y="82">Terraform &#183; GCP &#183; AWS &#183; Linux &#183; Git</text>
      <text class="tools" x="24" y="106">GitHub Actions &#183; Docker Compose &#183; Playwright</text>
      <text class="tools" x="24" y="130">OpenTelemetry &#183; regression tests &#183; release gates</text>
      <text class="tools" x="24" y="154">Observability &#183; incident intelligence</text>
      <text class="practice" x="24" y="180">MEASURED &#183; REVIEWABLE &#183; DEPLOYABLE</text>
    </g>
  </g>
</svg>

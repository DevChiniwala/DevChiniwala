<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="title desc">
  <title id="title">DevChiniwala GitHub profile telemetry</title>
  <desc id="desc">Daily generated public repository, merged pull request, external contribution, and language statistics from the GitHub REST API.</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7A8A9E" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    <linearGradient id="scan-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',monospace; }
    .index { font-size: 10px; font-weight: 700; fill: #7A8A9E; letter-spacing: 1.2px; }
    .metric { font-size: 50px; font-weight: 900; fill: #F8FAFC; letter-spacing: 1px; }
    .label { font-size: 12px; font-weight: 700; fill: #00E5FF; letter-spacing: 1.15px; }
    .detail { font-size: 10px; font-weight: 500; fill: #7A8A9E; letter-spacing: 0.45px; }
    .language { font-size: 11px; font-weight: 700; fill: #F8FAFC; letter-spacing: 0.7px; }
    .percentage { font-size: 10px; font-weight: 700; fill: #7DF9FF; }
    .scan { animation: scan 9s linear infinite; }
    .bar { animation: reveal 1s ease-out both; transform-box: fill-box; transform-origin: left center; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .orbit { animation: orbit 7s linear infinite; transform-box: fill-box; transform-origin: center; }
    .flow { animation: flow 2.4s linear infinite; }
    @keyframes scan {
      from { transform: translateX(-440px); }
      to { transform: translateX(1720px); }
    }
    @keyframes reveal {
      from { transform: scaleX(0); opacity: 0.25; }
      to { transform: scaleX(1); opacity: 0.82; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.42; transform: scale(0.82); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes orbit {
      to { transform: rotate(360deg); }
    }
    @keyframes flow {
      to { stroke-dashoffset: -24; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scan, .bar, .pulse, .orbit, .flow { animation: none; }
    }
  </style>

  <rect width="1280" height="560" fill="#080B10"/>
  <rect width="1280" height="560" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="558.5" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.85"/>
  <rect class="scan" x="-440" y="1" width="440" height="558" fill="url(#scan-gradient)"/>

  <g class="mono">
    <text x="32" y="38" font-size="12" font-weight="700" fill="#00E5FF" letter-spacing="2.7">PROFILE TELEMETRY // LIVE PUBLIC DATA</text>
    <g transform="translate(965 30)">
      <circle class="pulse" cx="0" cy="0" r="4" fill="#7DF9FF" filter="url(#glow)"/>
      <text x="14" y="4" font-size="9" font-weight="700" fill="#7DF9FF" letter-spacing="1.3">DAILY SYNC</text>
    </g>
    <text x="1248" y="38" text-anchor="end" font-size="9" fill="#7A8A9E" letter-spacing="1.1">GENERATED 2026-10-18 UTC</text>
    <line x1="32" y1="60" x2="1248" y2="60" stroke="#7A8A9E" stroke-width="1" opacity="0.28"/>


    <g transform="translate(32 82)">
      <rect width="394" height="164" rx="5" fill="#10141D" stroke="#7A8A9E" stroke-width="1"/>
      <rect width="5" height="164" rx="2.5" fill="#00E5FF"/>
      <text class="index" x="366" y="31" text-anchor="end">01</text>
      <text class="metric" x="28" y="91">52</text>
      <text class="label" x="28" y="124">PUBLIC REPOSITORIES</text>
      <text class="detail" x="28" y="148">reported by GitHub</text>
    </g>
    <g transform="translate(443 82)">
      <rect width="394" height="164" rx="5" fill="#10141D" stroke="#7A8A9E" stroke-width="1"/>
      <rect width="5" height="164" rx="2.5" fill="#00E5FF"/>
      <text class="index" x="366" y="31" text-anchor="end">02</text>
      <text class="metric" x="28" y="91">78</text>
      <text class="label" x="28" y="124">MERGED PULL REQUESTS</text>
      <text class="detail" x="28" y="148">public GitHub search</text>
    </g>
    <g transform="translate(854 82)">
      <rect width="394" height="164" rx="5" fill="#10141D" stroke="#7A8A9E" stroke-width="1"/>
      <rect width="5" height="164" rx="2.5" fill="#00E5FF"/>
      <text class="index" x="366" y="31" text-anchor="end">03</text>
      <text class="metric" x="28" y="91">11</text>
      <text class="label" x="28" y="124">EXTERNAL REPOS CONTRIBUTED</text>
      <text class="detail" x="28" y="148">unique public repositories</text>
    </g>

    <g transform="translate(32 264)">
      <rect width="790" height="260" rx="5" fill="#10141D" stroke="#7A8A9E" stroke-width="1"/>
      <text x="24" y="31" font-size="12" font-weight="700" fill="#00E5FF" letter-spacing="2">LANGUAGE DISTRIBUTION</text>
      <text x="766" y="31" text-anchor="end" font-size="9" fill="#7A8A9E" letter-spacing="1">BY GITHUB-DETECTED BYTES</text>
      <line x1="24" y1="46" x2="766" y2="46" stroke="#7A8A9E" stroke-width="1" opacity="0.24"/>

      <text class="language" x="32" y="80">PYTHON</text>
      <rect x="190" y="69" width="530" height="10" rx="2" fill="#080B10"/>
      <rect class="bar" x="190" y="69" width="194" height="10" rx="2" fill="#00E5FF" opacity="0.82" style="animation-delay:0.00s"/>
      <text class="percentage" x="752" y="80" text-anchor="end">36.6%</text>
      <text class="language" x="32" y="105">LIQUID</text>
      <rect x="190" y="94" width="530" height="10" rx="2" fill="#080B10"/>
      <rect class="bar" x="190" y="94" width="144" height="10" rx="2" fill="#00E5FF" opacity="0.82" style="animation-delay:0.12s"/>
      <text class="percentage" x="752" y="105" text-anchor="end">27.1%</text>
      <text class="language" x="32" y="130">TYPESCRIPT</text>
      <rect x="190" y="119" width="530" height="10" rx="2" fill="#080B10"/>
      <rect class="bar" x="190" y="119" width="108" height="10" rx="2" fill="#00E5FF" opacity="0.82" style="animation-delay:0.24s"/>
      <text class="percentage" x="752" y="130" text-anchor="end">20.3%</text>
      <text class="language" x="32" y="155">JAVASCRIPT</text>
      <rect x="190" y="144" width="530" height="10" rx="2" fill="#080B10"/>
      <rect class="bar" x="190" y="144" width="54" height="10" rx="2" fill="#00E5FF" opacity="0.82" style="animation-delay:0.36s"/>
      <text class="percentage" x="752" y="155" text-anchor="end">10.1%</text>
      <text class="language" x="32" y="180">CSS</text>
      <rect x="190" y="169" width="530" height="10" rx="2" fill="#080B10"/>
      <rect class="bar" x="190" y="169" width="15" height="10" rx="2" fill="#00E5FF" opacity="0.82" style="animation-delay:0.48s"/>
      <text class="percentage" x="752" y="180" text-anchor="end">2.8%</text>
      <text class="language" x="32" y="205">RUST</text>
      <rect x="190" y="194" width="530" height="10" rx="2" fill="#080B10"/>
      <rect class="bar" x="190" y="194" width="11" height="10" rx="2" fill="#00E5FF" opacity="0.82" style="animation-delay:0.60s"/>
      <text class="percentage" x="752" y="205" text-anchor="end">2.1%</text>
      <text class="language" x="32" y="230">OTHER</text>
      <rect x="190" y="219" width="530" height="10" rx="2" fill="#080B10"/>
      <rect class="bar" x="190" y="219" width="5" height="10" rx="2" fill="#00E5FF" opacity="0.82" style="animation-delay:0.72s"/>
      <text class="percentage" x="752" y="230" text-anchor="end">0.9%</text>
    </g>

    <g transform="translate(838 264)">
      <rect width="410" height="260" rx="5" fill="#10141D" stroke="#7A8A9E" stroke-width="1"/>
      <text x="24" y="31" font-size="12" font-weight="700" fill="#00E5FF" letter-spacing="2">DATA SCOPE</text>
      <text x="386" y="31" text-anchor="end" font-size="9" fill="#7A8A9E" letter-spacing="1">GITHUB REST API</text>
      <line x1="24" y1="46" x2="386" y2="46" stroke="#7A8A9E" stroke-width="1" opacity="0.24"/>

      <g transform="translate(98 135)">
        <circle r="56" fill="#080B10" stroke="#00E5FF" stroke-width="1.5" opacity="0.95"/>
        <circle class="orbit" r="77" fill="none" stroke="#7A8A9E" stroke-width="1" stroke-dasharray="2 9" opacity="0.55"/>
        <circle class="pulse" cx="0" cy="0" r="9" fill="#00E5FF" filter="url(#glow)"/>
        <circle class="orbit" cx="0" cy="-77" r="5" fill="#7DF9FF"/>
        <path class="flow" d="M-42 0H42" fill="none" stroke="#7DF9FF" stroke-width="1.4" stroke-dasharray="6 6" opacity="0.58"/>
      </g>

      <g transform="translate(196 79)">
        <text font-size="10" font-weight="700" fill="#F8FAFC" letter-spacing="1.1">OWNED REPOSITORIES</text>
        <text class="detail" y="21">public repositories only</text>
        <text y="61" font-size="10" font-weight="700" fill="#F8FAFC" letter-spacing="1.1">SOURCE FILTER</text>
        <text class="detail" y="82">forks excluded from language mix</text>
        <text y="122" font-size="10" font-weight="700" fill="#F8FAFC" letter-spacing="1.1">AUTOMATED REFRESH</text>
        <text class="detail" y="143">daily via GitHub Actions</text>
      </g>
    </g>

    <text x="32" y="546" font-size="8" fill="#7A8A9E" letter-spacing="0.8">COUNTS ARE A CURRENT SNAPSHOT &#183; LANGUAGE SHARE USES OWNED NON-FORK PUBLIC REPOSITORIES</text>
  </g>
</svg>
